<!DOCTYPE html>
<html lang="en" data-theme="light" data-fs="md">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Wordbook</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <style>
    /* ---------- Design tokens ---------- */
    :root {
      --bg: #FBF8F1;
      --bg2: #F3EEE3;
      --surface: #FFFFFF;
      --surface2: #FAF6EE;
      --ink: #232028;
      --ink-soft: #6B6577;
      --line: #EAE3D6;
      --line2: #E0D8C7;
      --primary: #5A46E8;
      --primary-soft: #EEEBFD;
      --primary-ink: #3B2CB8;
      --flame: #FF7A3C;
      --flame-soft: #FFEDE2;
      --gold: #F5B70A;
      --green: #1FA97A;
      --green-soft: #E4F6EF;
      --red: #E85869;
      --shadow: 0 1px 2px rgba(40, 30, 20, .05), 0 8px 24px -12px rgba(40, 30, 20, .18);
      --shadow-lg: 0 24px 48px -18px rgba(40, 30, 20, .28);
      --r: 20px;
      --r-sm: 14px;
      --r-xs: 10px;
      --maxw: 560px;
      --backdrop: #ECE5D6;
    }

    html[data-theme="dark"] {
      --bg: #15131A;
      --bg2: #1D1A24;
      --surface: #221E2B;
      --surface2: #1B1823;
      --ink: #F2EEF7;
      --ink-soft: #A69FB4;
      --line: #332E3F;
      --line2: #3E384C;
      --primary: #8878FF;
      --primary-soft: #2A2440;
      --primary-ink: #C9BEFF;
      --flame: #FF8C55;
      --flame-soft: #3A2418;
      --gold: #F7C948;
      --green: #3FC895;
      --green-soft: #17392C;
      --red: #F26E7E;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 30px -14px rgba(0, 0, 0, .6);
      --shadow-lg: 0 26px 54px -20px rgba(0, 0, 0, .7);
      --backdrop: #0C0B10;
    }

    html {
      font-size: 17px
    }

    html[data-fs="sm"] {
      font-size: 15px
    }

    html[data-fs="md"] {
      font-size: 17px
    }

    html[data-fs="lg"] {
      font-size: 19.5px
    }

    html[data-fs="xl"] {
      font-size: 22px
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent
    }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior-y: none;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: none;
      color: inherit
    }

    input,
    textarea,
    select {
      font-family: inherit;
      font-size: 1rem;
      color: inherit
    }

    .serif {
      font-family: 'Fraunces', Georgia, serif
    }

    ::selection {
      background: var(--primary);
      color: #fff
    }

    /* ---------- App shell ---------- */
    #app {
      max-width: var(--maxw);
      margin: 0 auto;
      height: 100dvh;
      position: relative;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      overflow: hidden
    }

    .topbar {
      flex: none;
      background: var(--bg);
      padding: calc(env(safe-area-inset-top) + .9rem) 1.15rem .7rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .6rem;
      border-bottom: 1px solid transparent
    }

    .topbar.bordered {
      border-bottom-color: var(--line)
    }

    .topbar h1 {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -.02em;
      display: flex;
      align-items: center;
      gap: .5rem
    }

    .topbar .sub {
      color: var(--ink-soft);
      font-size: .82rem;
      font-weight: 500;
      margin-top: .05rem
    }

    .brand-dot {
      width: .62rem;
      height: .62rem;
      border-radius: 50%;
      background: var(--primary);
      display: inline-block
    }

    main {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: .5rem 1.15rem 1.6rem;
      animation: fade .32s ease
    }

    @keyframes fade {
      from {
        opacity: 0;
        transform: translateY(6px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    /* base: sidebar brand + Add side panel are wide-screen only */
    .nav-brand {
      display: none
    }

    .reg-side {
      display: none
    }

    /* empty overlay/modal containers must not participate in the app grid layout */
    #overlay-root,
    #modal-root {
      display: contents
    }

    /* ---------- Bottom nav ---------- */
    .tabbar {
      flex: none;
      background: var(--surface);
      border-top: 1px solid var(--line);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      padding: .35rem .4rem calc(env(safe-area-inset-bottom) + .35rem)
    }

    .tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .15rem;
      padding: .5rem 0 .35rem;
      color: var(--ink-soft);
      border-radius: 14px;
      transition: color .18s, background .18s;
      position: relative
    }

    .tab svg {
      width: 1.55rem;
      height: 1.55rem;
      stroke-width: 2
    }

    .tab span {
      font-size: .68rem;
      font-weight: 700;
      letter-spacing: .01em
    }

    .tab.active {
      color: var(--primary)
    }

    .tab.active .tabicon {
      background: var(--primary-soft)
    }

    .tabicon {
      padding: .28rem .9rem;
      border-radius: 12px;
      display: flex;
      transition: background .2s
    }

    /* ---------- Buttons / chips ---------- */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .5rem;
      background: var(--primary);
      color: #fff;
      font-weight: 700;
      font-size: 1.02rem;
      padding: 1rem 1.2rem;
      border-radius: var(--r-sm);
      width: 100%;
      transition: transform .12s, filter .2s;
      box-shadow: 0 8px 20px -8px color-mix(in srgb, var(--primary) 60%, transparent)
    }

    .btn:active {
      transform: scale(.975);
      filter: brightness(.96)
    }

    .btn.ghost {
      background: var(--surface);
      color: var(--ink);
      box-shadow: var(--shadow);
      border: 1px solid var(--line)
    }

    .btn.soft {
      background: var(--primary-soft);
      color: var(--primary-ink);
      box-shadow: none
    }

    .btn.danger {
      background: var(--red);
      box-shadow: 0 8px 20px -8px color-mix(in srgb, var(--red) 55%, transparent)
    }

    .btn:disabled {
      opacity: .45;
      pointer-events: none
    }

    .btn svg {
      width: 1.2rem;
      height: 1.2rem
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      padding: .55rem .9rem;
      border-radius: 999px;
      background: var(--surface);
      border: 1.5px solid var(--line);
      color: var(--ink-soft);
      font-weight: 600;
      font-size: .9rem;
      white-space: nowrap;
      transition: .16s
    }

    .chip:active {
      transform: scale(.95)
    }

    .chip .dot {
      width: .55rem;
      height: .55rem;
      border-radius: 50%;
      flex: none
    }

    .chip.on {
      border-color: transparent;
      color: #fff;
      font-weight: 700
    }

    .iconbtn {
      width: 2.5rem;
      height: 2.5rem;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--surface);
      border: 1px solid var(--line);
      color: var(--ink-soft);
      box-shadow: var(--shadow)
    }

    .iconbtn svg {
      width: 1.25rem;
      height: 1.25rem;
      stroke-width: 2
    }

    .iconbtn:active {
      transform: scale(.92)
    }

    /* ---------- Cards / fields ---------- */
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r);
      box-shadow: var(--shadow)
    }

    .field {
      margin-bottom: 1.05rem
    }

    .field label {
      display: block;
      font-weight: 700;
      font-size: .82rem;
      color: var(--ink-soft);
      text-transform: uppercase;
      letter-spacing: .06em;
      margin: 0 0 .5rem .2rem
    }

    .field .opt {
      color: var(--primary);
      text-transform: none;
      letter-spacing: 0;
      font-weight: 600;
      font-size: .78rem
    }

    .input,
    .area {
      width: 100%;
      background: var(--surface);
      border: 1.5px solid var(--line2);
      border-radius: var(--r-sm);
      padding: .95rem 1rem;
      font-size: 1.08rem;
      font-weight: 500;
      transition: border .18s, box-shadow .18s;
      color: var(--ink)
    }

    .input:focus,
    .area:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--primary) 15%, transparent)
    }

    .input::placeholder,
    .area::placeholder {
      color: color-mix(in srgb, var(--ink-soft) 75%, transparent)
    }

    .area {
      min-height: 5.5rem;
      resize: vertical;
      line-height: 1.5
    }

    .wordinput {
      font-family: 'Fraunces', serif;
      font-size: 1.55rem;
      font-weight: 600;
      padding: 1rem
    }

    .eyebrow {
      font-size: .74rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--ink-soft)
    }

    /* category badge */
    .cat-badge {
      display: inline-flex;
      align-items: center;
      gap: .35rem;
      font-size: .74rem;
      font-weight: 800;
      padding: .28rem .6rem;
      border-radius: 999px;
      letter-spacing: .02em
    }

    /* ---------- Records ---------- */
    .searchwrap {
      position: relative;
      margin-bottom: .85rem
    }

    .searchwrap svg {
      position: absolute;
      left: .95rem;
      top: 50%;
      transform: translateY(-50%);
      width: 1.2rem;
      height: 1.2rem;
      color: var(--ink-soft);
      stroke-width: 2
    }

    .search {
      width: 100%;
      padding: .85rem 1rem .85rem 2.7rem;
      border-radius: 999px;
      border: 1.5px solid var(--line2);
      background: var(--surface);
      font-size: 1rem;
      font-weight: 500
    }

    .search:focus {
      outline: none;
      border-color: var(--primary)
    }

    .filterrow {
      display: flex;
      gap: .5rem;
      overflow-x: auto;
      padding: .15rem .1rem .55rem;
      margin: 0 -.15rem;
      scrollbar-width: none
    }

    .filterrow::-webkit-scrollbar {
      display: none
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: .2rem .1rem .8rem;
      gap: .6rem
    }

    .toolbar .count {
      font-size: .86rem;
      color: var(--ink-soft);
      font-weight: 600
    }

    .sortbtn {
      display: inline-flex;
      align-items: center;
      gap: .35rem;
      font-weight: 700;
      font-size: .85rem;
      color: var(--ink);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: .45rem .8rem;
      box-shadow: var(--shadow)
    }

    .sortbtn svg {
      width: 1rem;
      height: 1rem
    }

    .entry {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 1.05rem 1.1rem;
      margin-bottom: .75rem;
      box-shadow: var(--shadow);
      position: relative;
      border-left: 5px solid var(--catc, var(--primary));
      transition: transform .12s
    }

    .entry:active {
      transform: scale(.992)
    }

    .entry.done {
      opacity: .62
    }

    .entry .top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: .6rem
    }

    .entry .word {
      font-family: 'Fraunces', serif;
      font-size: 1.5rem;
      font-weight: 600;
      line-height: 1.15;
      word-break: break-word
    }

    .entry.done .word {
      text-decoration: line-through;
      text-decoration-thickness: 2px
    }

    .entry .ex {
      color: var(--ink-soft);
      font-size: .96rem;
      line-height: 1.5;
      margin-top: .4rem;
      font-style: italic
    }

    .entry .note {
      margin-top: .5rem;
      font-size: .9rem;
      color: var(--ink);
      background: var(--surface2);
      padding: .4rem .7rem;
      border-radius: var(--r-xs);
      display: inline-block;
      font-weight: 600
    }

    .entry .forms {
      margin-top: .25rem;
      font-size: .86rem;
      color: var(--ink-soft);
      font-weight: 600;
      font-family: 'Fraunces', serif;
      font-style: italic
    }

    .linkrow {
      display: flex;
      align-items: center;
      gap: .35rem;
      flex-wrap: wrap;
      margin-top: .6rem
    }

    .linkrow>svg {
      width: .95rem;
      height: .95rem;
      color: var(--ink-soft);
      flex: none;
      stroke-width: 2
    }

    .linkchip {
      font-family: 'Fraunces', serif;
      font-size: .88rem;
      font-weight: 600;
      background: var(--primary-soft);
      color: var(--primary-ink);
      padding: .2rem .55rem;
      border-radius: 999px
    }

    .linkchip:active {
      transform: scale(.95)
    }

    .rellabel {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: .68rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .04em;
      opacity: .7;
      margin-right: .3rem
    }

    /* Related-words entry on the Add screen */
    .relwrap {
      position: relative
    }

    .reldrop {
      position: absolute;
      top: calc(100% + .35rem);
      left: 0;
      right: 0;
      z-index: 30;
      background: var(--surface);
      border: 1.5px solid var(--line2);
      border-radius: var(--r-sm);
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      max-height: 15rem;
      overflow-y: auto
    }

    .reldrop-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .6rem;
      width: 100%;
      padding: .7rem .9rem;
      text-align: left;
      border-bottom: 1px solid var(--line)
    }

    .reldrop-row:last-child {
      border-bottom: none
    }

    .reldrop-row:hover {
      background: var(--surface2)
    }

    .reldrop-row.newrow {
      color: var(--primary);
      font-weight: 700;
      justify-content: flex-start;
      gap: .45rem
    }

    .reldrop-row.newrow svg {
      width: 1rem;
      height: 1rem;
      flex: none
    }

    .relchips {
      display: flex;
      flex-wrap: wrap;
      gap: .4rem;
      margin-top: .6rem
    }

    .relchip {
      display: inline-flex;
      align-items: center;
      gap: .3rem;
      padding: .3rem .4rem .3rem .3rem;
      border-radius: 999px;
      background: var(--primary-soft);
      color: var(--primary-ink);
      font-size: .9rem;
      font-weight: 600;
      border: 1.5px solid transparent
    }

    .relchip.new {
      background: var(--flame-soft);
      color: var(--flame);
      border-color: color-mix(in srgb, var(--flame) 35%, transparent)
    }

    .relchip-w {
      font-family: 'Fraunces', serif
    }

    .relchip-rel {
      font-size: .66rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .04em;
      background: color-mix(in srgb, currentColor 15%, transparent);
      color: inherit;
      padding: .15rem .4rem;
      border-radius: 999px;
      opacity: .85
    }

    .relchip-rel:active {
      transform: scale(.92)
    }

    .relchip-tag {
      font-size: .62rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .05em;
      opacity: .75
    }

    .relchip-x {
      display: flex;
      opacity: .6;
      padding: .1rem
    }

    .relchip-x svg {
      width: .85rem;
      height: .85rem;
      stroke-width: 2.5
    }

    .relchip-x:active {
      opacity: 1
    }

    .act.link.on {
      color: var(--primary);
      background: var(--primary-soft)
    }

    .tbleft {
      display: flex;
      align-items: center;
      gap: .6rem;
      min-width: 0;
      flex-wrap: wrap
    }

    .sortbtn.act {
      border-color: var(--primary);
      color: var(--primary);
      background: var(--primary-soft)
    }

    .sortbtn .chev {
      font-size: .75rem;
      opacity: .7
    }

    .sortbtn>span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 9rem
    }

    .entry .foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: .85rem;
      gap: .5rem
    }

    .entry .date {
      font-size: .76rem;
      color: var(--ink-soft);
      font-weight: 600
    }

    .entry .acts {
      display: flex;
      gap: .3rem
    }

    .act {
      width: 2.2rem;
      height: 2.2rem;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink-soft);
      background: var(--surface2);
      transition: .15s
    }

    .act svg {
      width: 1.15rem;
      height: 1.15rem;
      stroke-width: 2
    }

    .act:active {
      transform: scale(.88)
    }

    .act.star.on {
      color: var(--gold);
      background: color-mix(in srgb, var(--gold) 16%, transparent)
    }

    .act.check.on {
      color: var(--green);
      background: var(--green-soft)
    }

    .act.star.on svg,
    .act.check.on svg {
      fill: currentColor
    }

    /* ---------- Empty state ---------- */
    .empty {
      text-align: center;
      padding: 3.5rem 1.5rem;
      color: var(--ink-soft)
    }

    .empty .emoji {
      font-size: 2.8rem;
      margin-bottom: .6rem
    }

    .empty h3 {
      font-size: 1.2rem;
      color: var(--ink);
      font-weight: 800;
      margin-bottom: .35rem
    }

    .empty p {
      font-size: .95rem;
      line-height: 1.5;
      max-width: 20rem;
      margin: 0 auto
    }

    /* ---------- Quiz home ---------- */
    .streakcard {
      background: linear-gradient(135deg, var(--flame), #FF9E3D);
      border-radius: var(--r);
      padding: 1.3rem 1.4rem;
      color: #fff;
      box-shadow: 0 16px 32px -16px color-mix(in srgb, var(--flame) 70%, transparent);
      display: flex;
      align-items: center;
      gap: 1.1rem;
      margin-bottom: 1rem;
      position: relative;
      overflow: hidden
    }

    .streakcard .flame {
      font-size: 3rem;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, .2));
      animation: flicker 2.2s ease-in-out infinite
    }

    @keyframes flicker {

      0%,
      100% {
        transform: scale(1) rotate(-2deg)
      }

      50% {
        transform: scale(1.08) rotate(2deg)
      }
    }

    .streakcard .n {
      font-size: 2.6rem;
      font-weight: 800;
      line-height: 1
    }

    .streakcard .lbl {
      font-size: .85rem;
      font-weight: 700;
      opacity: .92
    }

    .streakcard .r {
      margin-left: auto;
      text-align: right;
      font-size: .8rem;
      font-weight: 600;
      opacity: .9;
      line-height: 1.6
    }

    .statrow {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: .6rem;
      margin-bottom: 1.2rem
    }

    .stat {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r-sm);
      padding: .85rem .5rem;
      text-align: center;
      box-shadow: var(--shadow)
    }

    .stat .v {
      font-size: 1.5rem;
      font-weight: 800;
      line-height: 1
    }

    .stat .k {
      font-size: .72rem;
      color: var(--ink-soft);
      font-weight: 700;
      margin-top: .25rem
    }

    .qgrid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: .75rem
    }

    .qcard {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 1.1rem;
      box-shadow: var(--shadow);
      text-align: left;
      transition: transform .12s;
      position: relative;
      overflow: hidden
    }

    .qcard:active {
      transform: scale(.97)
    }

    .qcard .ic {
      width: 2.7rem;
      height: 2.7rem;
      border-radius: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      margin-bottom: .7rem
    }

    .qcard h4 {
      font-size: 1.02rem;
      font-weight: 800;
      letter-spacing: -.01em
    }

    .qcard p {
      font-size: .8rem;
      color: var(--ink-soft);
      font-weight: 500;
      margin-top: .2rem;
      line-height: 1.35
    }

    .qcard.locked {
      opacity: .5;
      pointer-events: none
    }

    .qcard .lock {
      position: absolute;
      top: .8rem;
      right: .8rem;
      font-size: .9rem
    }

    .scopebar {
      display: flex;
      gap: .5rem;
      overflow-x: auto;
      padding: .1rem .1rem .3rem;
      margin: .2rem -.15rem 1.1rem;
      scrollbar-width: none
    }

    .scopebar::-webkit-scrollbar {
      display: none
    }

    /* ---------- Quiz session (overlay) ---------- */
    .overlay {
      position: absolute;
      inset: 0;
      z-index: 60;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      animation: slideup .3s cubic-bezier(.2, .8, .2, 1)
    }

    @keyframes slideup {
      from {
        transform: translateY(100%)
      }

      to {
        transform: none
      }
    }

    .qhead {
      padding: calc(env(safe-area-inset-top) + .8rem) 1.15rem .7rem;
      display: flex;
      align-items: center;
      gap: .8rem
    }

    .progress {
      flex: 1;
      height: .6rem;
      background: var(--bg2);
      border-radius: 999px;
      overflow: hidden
    }

    .progress i {
      display: block;
      height: 100%;
      background: var(--primary);
      border-radius: 999px;
      transition: width .35s cubic-bezier(.2, .8, .2, 1)
    }

    .combo {
      display: flex;
      align-items: center;
      gap: .25rem;
      font-weight: 800;
      color: var(--flame);
      font-size: .95rem;
      min-width: 2.7rem;
      justify-content: flex-end
    }

    /* Speed-round timer */
    .qtimer {
      flex: 1;
      text-align: center;
      font-family: 'Fraunces', serif;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: -.01em;
      transition: color .2s
    }

    .qtimer.low {
      color: var(--red);
      animation: pulse .9s ease-in-out infinite
    }

    @keyframes pulse {

      0%,
      100% {
        transform: scale(1)
      }

      50% {
        transform: scale(1.12)
      }
    }

    /* Recall */
    .recallbox {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 1.6rem 1.4rem;
      margin: auto 0;
      box-shadow: var(--shadow);
      text-align: center
    }

    .rc-ex {
      font-size: 1.15rem;
      line-height: 1.65;
      font-style: italic;
      color: var(--ink)
    }

    .rc-note {
      margin-top: .9rem;
      background: var(--primary-soft);
      color: var(--primary-ink);
      padding: .5rem .8rem;
      border-radius: var(--r-xs);
      font-weight: 700;
      display: inline-block
    }

    .rc-forms,
    .rc-links {
      margin-top: .7rem;
      font-size: .86rem;
      color: var(--ink-soft);
      font-weight: 600
    }

    .rc-answer {
      text-align: center;
      margin: 1.4rem 0 auto;
      animation: fade .3s ease
    }

    .rc-word {
      font-family: 'Fraunces', serif;
      font-size: 2.2rem;
      font-weight: 600;
      color: var(--primary);
      margin-top: .3rem;
      word-break: break-word
    }

    .qbody {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 1rem 1.15rem;
      overflow-y: auto
    }

    .qmeta {
      text-align: center;
      margin-bottom: 1rem
    }

    .qbig {
      font-family: 'Fraunces', serif;
      font-size: 2.4rem;
      font-weight: 600;
      text-align: center;
      line-height: 1.15;
      margin: auto 0;
      word-break: break-word
    }

    .qprompt {
      font-size: 1.15rem;
      line-height: 1.6;
      text-align: center;
      margin: auto 0;
      font-weight: 500
    }

    .blank {
      display: inline-block;
      min-width: 3.4rem;
      border-bottom: 3px solid var(--primary);
      margin: 0 .15rem;
      color: var(--primary);
      font-weight: 800;
      text-align: center
    }

    .opts {
      display: flex;
      flex-direction: column;
      gap: .65rem;
      margin-top: 1.4rem
    }

    .opt {
      background: var(--surface);
      border: 2px solid var(--line);
      border-radius: var(--r-sm);
      padding: 1.05rem 1.1rem;
      font-size: 1.15rem;
      font-weight: 600;
      text-align: center;
      font-family: 'Fraunces', serif;
      transition: .15s
    }

    .opt:active {
      transform: scale(.98)
    }

    .opt.correct {
      border-color: var(--green);
      background: var(--green-soft);
      color: var(--green)
    }

    .opt.wrong {
      border-color: var(--red);
      background: color-mix(in srgb, var(--red) 12%, transparent);
      color: var(--red)
    }

    .opt.dim {
      opacity: .4
    }

    .tiles {
      display: flex;
      flex-wrap: wrap;
      gap: .5rem;
      justify-content: center;
      margin-top: 1.5rem
    }

    .tile {
      min-width: 2.9rem;
      height: 3.2rem;
      padding: 0 .5rem;
      border-radius: 12px;
      background: var(--surface);
      border: 2px solid var(--line2);
      font-family: 'Fraunces', serif;
      font-size: 1.4rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: .12s
    }

    .tile:active {
      transform: scale(.9)
    }

    .tile.used {
      opacity: .25;
      pointer-events: none
    }

    .answer-slots {
      min-height: 3.5rem;
      display: flex;
      flex-wrap: wrap;
      gap: .4rem;
      justify-content: center;
      align-items: center;
      padding: .9rem;
      background: var(--surface2);
      border-radius: var(--r-sm);
      border: 2px dashed var(--line2);
      margin-bottom: .3rem
    }

    .slot {
      font-family: 'Fraunces', serif;
      font-size: 1.5rem;
      font-weight: 600;
      padding: .1rem .3rem;
      border-bottom: 2px solid var(--primary);
      min-width: 1.2rem;
      text-align: center
    }

    .flashcard {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: .5rem 0;
      perspective: 1200px
    }

    .fc-inner {
      width: 100%;
      min-height: 16rem;
      position: relative;
      transform-style: preserve-3d;
      transition: transform .5s cubic-bezier(.4, .2, .2, 1)
    }

    .fc-inner.flipped {
      transform: rotateY(180deg)
    }

    .fc-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r);
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.8rem;
      text-align: center
    }

    .fc-back {
      transform: rotateY(180deg);
      justify-content: flex-start;
      overflow-y: auto
    }

    .fc-face .fw {
      font-family: 'Fraunces', serif;
      font-size: 2.3rem;
      font-weight: 600;
      line-height: 1.15;
      word-break: break-word
    }

    .fc-hint {
      position: absolute;
      bottom: 1.1rem;
      font-size: .78rem;
      color: var(--ink-soft);
      font-weight: 600
    }

    .fc-back .bw {
      font-family: 'Fraunces', serif;
      font-size: 1.7rem;
      font-weight: 600;
      margin: 1.4rem 0 .3rem
    }

    .fc-back .bex {
      font-style: italic;
      color: var(--ink-soft);
      font-size: 1.02rem;
      line-height: 1.55;
      margin-top: .6rem
    }

    .fc-back .bnote {
      margin-top: .9rem;
      background: var(--primary-soft);
      color: var(--primary-ink);
      padding: .5rem .8rem;
      border-radius: var(--r-xs);
      font-weight: 700
    }

    .qfoot {
      padding: .9rem 1.15rem calc(env(safe-area-inset-bottom) + 1rem);
      display: flex;
      gap: .6rem
    }

    .feedback {
      text-align: center;
      font-weight: 800;
      font-size: 1.05rem;
      padding: .6rem;
      border-radius: var(--r-sm);
      margin-top: .9rem
    }

    .feedback.ok {
      color: var(--green);
      background: var(--green-soft)
    }

    .feedback.no {
      color: var(--red);
      background: color-mix(in srgb, var(--red) 12%, transparent)
    }

    /* results */
    .results {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      text-align: center
    }

    .results .big {
      font-size: 4rem;
      margin-bottom: .4rem;
      animation: pop .5s cubic-bezier(.2, 1.4, .4, 1)
    }

    @keyframes pop {
      from {
        transform: scale(0)
      }

      to {
        transform: scale(1)
      }
    }

    .results h2 {
      font-size: 1.7rem;
      font-weight: 800
    }

    .results .score {
      font-family: 'Fraunces', serif;
      font-size: 3.4rem;
      font-weight: 700;
      color: var(--primary);
      margin: .6rem 0
    }

    .results .sub {
      color: var(--ink-soft);
      font-weight: 600;
      margin-bottom: .4rem
    }

    .results .xp {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      background: var(--primary-soft);
      color: var(--primary-ink);
      font-weight: 800;
      padding: .5rem 1rem;
      border-radius: 999px;
      margin-top: .8rem
    }

    /* ---------- Settings ---------- */
    .setgroup {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r);
      box-shadow: var(--shadow);
      margin-bottom: 1.1rem;
      overflow: hidden
    }

    .setgroup>.gh {
      padding: .85rem 1.1rem .3rem;
      font-size: .76rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--ink-soft)
    }

    .setrow {
      padding: 1rem 1.1rem;
      border-top: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem
    }

    .setrow:first-of-type {
      border-top: none
    }

    .setrow .l {
      font-weight: 700;
      font-size: 1rem
    }

    .setrow .d {
      font-size: .82rem;
      color: var(--ink-soft);
      font-weight: 500;
      margin-top: .15rem
    }

    .seg {
      display: inline-flex;
      background: var(--bg2);
      border-radius: 12px;
      padding: .25rem;
      gap: .2rem
    }

    .seg button {
      padding: .45rem .7rem;
      border-radius: 9px;
      font-weight: 800;
      font-size: .85rem;
      color: var(--ink-soft);
      transition: .15s
    }

    .seg button.on {
      background: var(--surface);
      color: var(--primary);
      box-shadow: var(--shadow)
    }

    .segA button {
      font-family: 'Fraunces', serif
    }

    .switch {
      width: 3.2rem;
      height: 1.9rem;
      border-radius: 999px;
      background: var(--line2);
      position: relative;
      transition: .2s;
      flex: none
    }

    .switch.on {
      background: var(--primary)
    }

    .switch i {
      position: absolute;
      top: .22rem;
      left: .22rem;
      width: 1.46rem;
      height: 1.46rem;
      border-radius: 50%;
      background: #fff;
      transition: .22s;
      box-shadow: 0 2px 4px rgba(0, 0, 0, .2)
    }

    .switch.on i {
      left: 1.52rem
    }

    .setrow.col {
      flex-direction: column;
      align-items: stretch
    }

    .setrow.col .l {
      margin-bottom: .6rem
    }

    .miniinput {
      width: 100%;
      background: var(--surface2);
      border: 1.5px solid var(--line2);
      border-radius: var(--r-xs);
      padding: .7rem .8rem;
      font-size: .9rem;
      font-family: ui-monospace, monospace
    }

    .miniinput:focus {
      outline: none;
      border-color: var(--primary)
    }

    .synced {
      display: inline-flex;
      align-items: center;
      gap: .35rem;
      font-size: .78rem;
      font-weight: 700;
      padding: .25rem .6rem;
      border-radius: 999px
    }

    .synced.on {
      color: var(--green);
      background: var(--green-soft)
    }

    .synced.off {
      color: var(--ink-soft);
      background: var(--bg2)
    }

    .helpbox {
      background: var(--surface2);
      border-radius: var(--r-xs);
      padding: .9rem 1rem;
      font-size: .82rem;
      color: var(--ink-soft);
      line-height: 1.6;
      margin-top: .6rem
    }

    .helpbox code {
      background: var(--bg2);
      padding: .05rem .3rem;
      border-radius: 5px;
      font-size: .85em
    }

    .link {
      color: var(--primary);
      font-weight: 700;
      text-decoration: none
    }

    /* ---------- Modal ---------- */
    .modal-bg {
      position: absolute;
      inset: 0;
      z-index: 70;
      background: rgba(20, 15, 25, .5);
      backdrop-filter: blur(3px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      animation: fade .2s
    }

    .modal {
      background: var(--bg);
      width: 100%;
      border-radius: 24px 24px 0 0;
      padding: 1.4rem 1.2rem calc(env(safe-area-inset-bottom) + 1.4rem);
      max-height: 90%;
      overflow-y: auto;
      animation: slideup .3s cubic-bezier(.2, .8, .2, 1)
    }

    .modal .grab {
      width: 2.4rem;
      height: .3rem;
      background: var(--line2);
      border-radius: 999px;
      margin: 0 auto 1.1rem
    }

    .modal h3 {
      font-size: 1.25rem;
      font-weight: 800;
      margin-bottom: 1.1rem
    }

    .modal .row2 {
      display: flex;
      gap: .6rem;
      margin-top: .4rem
    }

    /* ---------- Toast ---------- */
    #toast {
      position: absolute;
      bottom: 5.2rem;
      left: 50%;
      transform: translateX(-50%) translateY(2rem);
      z-index: 90;
      background: var(--ink);
      color: var(--bg);
      padding: .8rem 1.2rem;
      border-radius: 999px;
      font-weight: 700;
      font-size: .92rem;
      box-shadow: var(--shadow-lg);
      opacity: 0;
      transition: .3s cubic-bezier(.2, .8, .2, 1);
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: .5rem;
      max-width: 90%
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0)
    }

    #toast .em {
      font-size: 1.1rem
    }

    .confetti {
      position: absolute;
      width: .6rem;
      height: .6rem;
      z-index: 80;
      pointer-events: none;
      border-radius: 2px
    }

    /* ---------- Compact register preview + select + picker ---------- */
    .metastrip {
      display: flex;
      align-items: center;
      gap: .5rem;
      flex-wrap: wrap;
      font-size: .84rem;
      color: var(--ink-soft);
      font-weight: 600;
      margin: 0 .1rem 1.2rem
    }

    .selectbtn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .6rem;
      background: var(--surface);
      border: 1.5px solid var(--line2);
      border-radius: var(--r-sm);
      padding: .9rem 1rem;
      font-size: 1.05rem;
      font-weight: 600;
      transition: border .18s
    }

    .selectbtn:active {
      border-color: var(--primary)
    }

    .selectbtn .ph {
      color: color-mix(in srgb, var(--ink-soft) 85%, transparent);
      font-weight: 500
    }

    .selectbtn .chev {
      color: var(--ink-soft);
      font-size: .9rem
    }

    .picklist {
      display: flex;
      flex-direction: column;
      gap: .45rem;
      max-height: 48vh;
      overflow-y: auto
    }

    .pickrow {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .6rem;
      padding: .9rem 1rem;
      border-radius: var(--r-sm);
      border: 1.5px solid var(--line);
      background: var(--surface);
      font-weight: 600;
      font-size: 1.05rem;
      text-align: left
    }

    .pickrow:active {
      transform: scale(.99)
    }

    .pickrow.on {
      border-color: var(--primary);
      background: var(--primary-soft);
      color: var(--primary-ink)
    }

    .pickrow .tick {
      color: var(--primary);
      font-weight: 800
    }

    /* two-row filter grouping */
    .filterrow+.filterrow {
      margin-top: -.35rem
    }

    /* Add-screen side panel (wide only) */
    .reg-side {
      background: var(--surface2);
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 1.2rem 1.1rem
    }

    .side-item {
      padding: .65rem 0;
      border-top: 1px solid var(--line)
    }

    .side-item:first-of-type {
      border-top: none;
      padding-top: 0
    }

    .side-word {
      font-family: 'Fraunces', serif;
      font-size: 1.15rem;
      font-weight: 600;
      line-height: 1.2;
      word-break: break-word
    }

    .side-meta {
      display: flex;
      align-items: center;
      gap: .35rem;
      flex-wrap: wrap;
      margin-top: .25rem;
      font-size: .78rem;
      color: var(--ink-soft);
      font-weight: 600
    }

    /* sign-in gate */
    .authgate {
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem
    }

    .authbox {
      width: 100%;
      max-width: 360px;
      text-align: center
    }

    .authlogo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .55rem;
      font-weight: 800;
      font-size: 1.9rem;
      letter-spacing: -.02em;
      margin-bottom: .5rem
    }

    .authlogo .brand-dot {
      width: .8rem;
      height: .8rem
    }

    .authsub {
      color: var(--ink-soft);
      font-weight: 500;
      line-height: 1.5;
      margin-bottom: 1.5rem
    }

    .autherr {
      color: var(--red);
      font-weight: 700;
      font-size: .86rem;
      margin-top: .6rem;
      min-height: 1rem;
      line-height: 1.4
    }

    .au-switch {
      display: block;
      width: 100%;
      margin-top: 1rem;
      color: var(--primary);
      font-weight: 700;
      font-size: .9rem
    }

    .authfoot {
      color: var(--ink-soft);
      font-size: .8rem;
      font-weight: 500;
      line-height: 1.5;
      margin-top: 1rem
    }

    .au-back {
      display: block;
      color: var(--ink-soft);
      font-weight: 700;
      font-size: .88rem;
      margin-bottom: .9rem;
      text-align: left
    }

    .au-back:active {
      opacity: .6
    }

    /* ================= Responsive web layout (wide screens) =================
   Placed at the END of the stylesheet so these rules win over the base
   component rules above (equal specificity → later source order wins). */
    @media (min-width:840px) {
      body {
        background: var(--bg);
        display: block;
        padding: 0
      }

      #app {
        max-width: 1280px;
        height: 100vh;
        display: grid;
        grid-template-columns: 236px minmax(0, 1fr);
        grid-template-rows: auto 1fr;
        grid-template-areas: "nav top" "nav main";
        overflow: hidden;
        border-radius: 0
      }

      .topbar {
        grid-area: top;
        background: var(--bg);
        padding: 1.5rem 2.2rem .9rem;
        border-bottom: 1px solid var(--line)
      }

      .topbar h1 {
        font-size: 1.75rem
      }

      main {
        grid-area: main;
        padding: 1.4rem 2.2rem 2.4rem
      }

      /* bottom tab bar becomes a left sidebar */
      .tabbar {
        grid-area: nav;
        display: flex;
        flex-direction: column;
        gap: .25rem;
        border-top: none;
        border-right: 1px solid var(--line);
        background: var(--surface2);
        padding: 1.5rem .8rem
      }

      .nav-brand {
        display: flex;
        align-items: center;
        gap: .55rem;
        font-weight: 800;
        font-size: 1.28rem;
        letter-spacing: -.02em;
        padding: .3rem .8rem 1.4rem
      }

      .nav-brand .brand-dot {
        width: .7rem;
        height: .7rem
      }

      .tab {
        flex-direction: row;
        justify-content: flex-start;
        align-items: center;
        gap: .8rem;
        padding: .85rem 1rem;
        border-radius: 14px
      }

      .tab .tabicon {
        padding: 0;
        background: none
      }

      .tab.active .tabicon {
        background: none
      }

      .tab svg {
        width: 1.4rem;
        height: 1.4rem
      }

      .tab span:last-child {
        font-size: 1rem;
        font-weight: 700
      }

      .tab.active {
        background: var(--primary-soft)
      }

      .tab:hover:not(.active) {
        background: color-mix(in srgb, var(--ink) 5%, transparent)
      }

      /* content reflows into columns */
      .rec-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(288px, 1fr));
        gap: 1rem;
        align-items: start
      }

      .rec-grid .entry {
        margin-bottom: 0
      }

      .set-wrap {
        column-count: 2;

    /* ---------- Categories ---------- */
    const CAT_COLORS = ['#5A46E8', '#E8578A', '#1FA97A', '#F59E0B', '#8B5CF6', '#0EA5E9', '#EF4444', '#14B8A6', '#64748B'];

    function rawSet(k, v) { if (hasLS) { try { localStorage.setItem(k, v); return } catch (e) { hasLS = false } } memStore[k] = v; }

    function load() {
      const s = rawGet(KEY);
      if (s) {
        try {
          const d = JSON.parse(s);
          if (d.entries) S.entries = d.entries;
          if (d.cats && d.cats.length) S.cats = d.cats;
          if (d.lastCat) S.lastCat = d.lastCat;
          if (d.lastSub) S.lastSub = d.lastSub;
          if (d.catsUpdatedAt) S.catsUpdatedAt = d.catsUpdatedAt;
          if (d.settings) Object.assign(S.settings, d.settings);
          if (d.game) Object.assign(S.game, d.game);
          if (d.cfg) Object.assign(S.cfg, d.cfg);

      }

      S.cats.forEach(c => { if (!Array.isArray(c.subs)) c.subs = []; if (!c.subLabel) c.subLabel = 'Source'; });
      if (typeof S.lastSub !== 'object' || !S.lastSub) S.lastSub = {};
    }
    let _catsSig = null;
    function catsSignature() { try { return JSON.stringify(S.cats); } catch (e) { return ''; } }
    function save() {
      // Whenever the category list (including its titles/topics) changes, mark it and
      // push upstream. Doing it here means every add/rename/delete path syncs, with no

      const sig = catsSignature();

        S.catsUpdatedAt = Date.now();
        if (fbReady && fbDB) { try { fbDB.ref('cats').set({ list: S.cats, updatedAt: S.catsUpdatedAt }); } catch (e) { } }
      }
      _catsSig = sig;
      rawSet(KEY, JSON.stringify({
        entries: S.entries, cats: S.cats, lastCat: S.lastCat, lastSub: S.lastSub,
        catsUpdatedAt: S.catsUpdatedAt, settings: S.settings, game: S.game, cfg: S.cfg

    /* ---------- Streak ---------- */
    function touchStreak() {
      const tk = todayKey();

    /* ============================================================
       SYNC — Firebase Realtime DB + Google Sheets webhook
       ============================================================ */
    let fbDB = null, fbReady = false;
    function loadScript(src) {

        document.head.appendChild(s);
      });
    }
    function parseFirebaseConfig(raw) {

          save();
          if (changed) catsPush();         // unless our merge added something new

        } else if ((remote.updatedAt || 0) < (S.catsUpdatedAt || 0)) {
          catsPush();   // ours is newer, push it up
        }
      }, err => { });
    }
    /* Union-merge so a category added offline on one device is never silently lost. */
    function mergeCats(localCats, remoteCats) {
      const out = remoteCats.map(c => ({
        name: c.name, color: c.color || '#64748B', emoji: c.emoji || '✳️',
        subLabel: c.subLabel || 'Source', subs: Array.isArray(c.subs) ? c.subs.slice() : []
      }));
      const byName = {};
      out.forEach(c => byName[c.name.toLowerCase()] = c);
      localCats.forEach(lc => {
        const hit = byName[lc.name.toLowerCase()];
        if (!hit) { out.push(lc); return; }
        // keep any sub items this device has that the remote copy lacks
        (lc.subs || []).forEach(s => {
          if (!hit.subs.some(x => x.toLowerCase() === s.toLowerCase())) hit.subs.push(s);
        });
      });

      if (!fbReady || !fbDB) return;
      S.catsUpdatedAt = Date.now();

      rawSet(KEY, JSON.stringify({
        entries: S.entries, cats: S.cats, lastCat: S.lastCat, lastSub: S.lastSub,
        catsUpdatedAt: S.catsUpdatedAt, settings: S.settings, game: S.game, cfg: S.cfg
      }));
      try { fbDB.ref('cats').set({ list: S.cats, updatedAt: S.catsUpdatedAt }); } catch (e) { }
    }
    function signOutFirebase() {
      try { if (fbDB) { fbDB.ref('vocab').off(); fbDB.ref('cats').off(); } } catch (e) { }

    /* Persist + push one entry everywhere */
    function persistEntry(action, entry) {
      save();
      if (action === 'delete') { fbRemove(entry.id); }
      else { fbWrite(entry); }

    /* ============================================================
       ENTRY CRUD
       ============================================================ */
    function addEntry({ category, sub, word, example, note, forms }) {
      const now = Date.now();
      const e = {
        id: uid(), category, sub: (sub || '').trim(), word: word.trim(), example: (example || '').trim(),
        note: (note || '').trim(), forms: (forms || '').trim(), links: [], rels: {},
        date: now, updatedAt: now, done: false, fav: false

      touchStreak();
      persistEntry('create', e);
      return e;
    }
    function updateEntry(id, patch) {
      const e = S.entries.find(x => x.id === id); if (!e) return;
      Object.assign(e, patch, { updatedAt: Date.now() });
      persistEntry('update', e);
    }
    function deleteEntry(id) {
      const e = S.entries.find(x => x.id === id);
      // drop this word from any other word's link list so no dead references remain
      S.entries.forEach(o => {
        if (o.id !== id && Array.isArray(o.links) && o.links.includes(id)) {
          o.links = o.links.filter(x => x !== id);
          if (o.rels) delete o.rels[id];
          o.updatedAt = Date.now();
          persistEntry('update', o);
        }
      });
      S.entries = S.entries.filter(x => x.id !== id);
      if (e) persistEntry('delete', e);
    }
    /* Links are mutual: connecting A→B also connects B→A. */
    function linksOf(e) { return Array.isArray(e && e.links) ? e.links : []; }
    function linkedEntries(e) {
      return linksOf(e).map(id => S.entries.find(x => x.id === id)).filter(Boolean);
    }
    /* Optional relation label for a link, stored on both sides as rels[otherId].
       Left empty by default — labelling is a nicety, never a required step. */
    const REL_TYPES = ['', 'synonym', 'opposite', 'part of', 'related'];
    const REL_MIRROR = { 'part of': 'includes', 'includes': 'part of' };
    function relOf(e, otherId) { return (e && e.rels && e.rels[otherId]) || ''; }
    function setRel(idA, idB, rel) {
      const a = S.entries.find(x => x.id === idA), b = S.entries.find(x => x.id === idB);
      if (!a || !b) return;
      if (!a.rels) a.rels = {};
      if (!b.rels) b.rels = {};
      if (rel) {
        a.rels[idB] = rel;
        b.rels[idA] = REL_MIRROR[rel] || rel;
      } else {
        delete a.rels[idB];
        delete b.rels[idA];
      }
      const now = Date.now(); a.updatedAt = now; b.updatedAt = now;
      persistEntry('update', a); persistEntry('update', b);
    }
    function toggleLink(idA, idB, rel) {
      if (idA === idB) return;
      const a = S.entries.find(x => x.id === idA), b = S.entries.find(x => x.id === idB);
      if (!a || !b) return;
      if (!Array.isArray(a.links)) a.links = [];
      if (!Array.isArray(b.links)) b.links = [];
      const on = a.links.includes(idB);
      if (on) {
        a.links = a.links.filter(x => x !== idB);
        b.links = b.links.filter(x => x !== idA);
        if (a.rels) delete a.rels[idB];
        if (b.rels) delete b.rels[idA];
      } else {
        a.links.push(idB);
        b.links.push(idA);
        if (rel) {
          if (!a.rels) a.rels = {};
          if (!b.rels) b.rels = {};
          a.rels[idB] = rel;
          b.rels[idA] = REL_MIRROR[rel] || rel;
        }
      }
      const now = Date.now();
      a.updatedAt = now; b.updatedAt = now;
      persistEntry('update', a);
      persistEntry('update', b);
      return !on;
    }
    /* Find an existing word by text (case-insensitive), if any. */
    function findByWord(text) {
      const t = (text || '').trim().toLowerCase();
      if (!t) return null;
      return S.entries.find(x => (x.word || '').trim().toLowerCase() === t) || null;
    }

    /* ---------- RECORDS ---------- */
    function filteredEntries() {
      let list = S.entries.slice();
      const f = S.ui.filter;
      if (f === 'Favorites') list = list.filter(e => e.fav);
      else if (f === 'Done') list = list.filter(e => e.done);
      else if (f === 'Active') list = list.filter(e => !e.done);
      else if (f !== 'All') list = list.filter(e => e.category === f);
      const sf = S.ui.subFilter;
      if (sf && sf !== 'All') {
        if (sf === '__none__') list = list.filter(e => !e.sub);
        else list = list.filter(e => e.sub === sf);
      }
      const q = S.ui.q.trim().toLowerCase();
      if (q) list = list.filter(e =>
        (e.word || '').toLowerCase().includes(q) ||
        (e.example || '').toLowerCase().includes(q) ||
        (e.note || '').toLowerCase().includes(q) ||
        (e.forms || '').toLowerCase().includes(q) ||
        (e.sub || '').toLowerCase().includes(q));
      list.sort((a, b) => S.ui.sort === 'newest' ? b.date - a.date : a.date - b.date);
      return list;
    }
    /* Titles available for the current category filter, drawn from both the saved
       category list and whatever titles actually appear on existing words. */
    function availableSubs() {
      const f = S.ui.filter;
      const cats = (f === 'All' || f === 'Favorites' || f === 'Active' || f === 'Done')
        ? S.cats : S.cats.filter(c => c.name === f);
      const set = new Map();   // lowercase → display form
      cats.forEach(c => (c.subs || []).forEach(s => { if (s) set.set(s.toLowerCase(), s); }));
      const catNames = new Set(cats.map(c => c.name));
      S.entries.forEach(e => {
        if (e.sub && catNames.has(e.category)) set.set(e.sub.toLowerCase(), e.sub);
      });
      return [...set.values()].sort((a, b) => a.localeCompare(b));
    }
    function viewRecords() {

    function entryRow(e) {
      const c = catOf(e.category);

    /* ---------- QUIZ home ---------- */
    function scopedEntries() {
      const s = S.ui.scope;
      let list = S.entries.slice();
      if (s === 'Favorites') list = list.filter(e => e.fav);
      else if (s === 'Active') list = list.filter(e => !e.done);
      else if (s !== 'All') list = list.filter(e => e.category === s);
      return list;
    }
    function usableForBlank(list) {
      return list.filter(e => {
        if (!e.example) return false;
        return e.example.toLowerCase().includes((e.word || '').toLowerCase()) && e.word.length > 1;
      });
    }
    /* Recall needs a context to think from: an example, a note, or listed forms. */
    function usableForRecall(list) {
      return list.filter(e => (e.example && e.example.trim()) || (e.note && e.note.trim()) || (e.forms && e.forms.trim()));
    }
    /* Odd-one-out needs a word with at least 2 links, plus outsiders to contrast with. */
    function usableForOdd(list) {
      return list.filter(e => {
        const ls = linksOf(e).filter(id => S.entries.some(x => x.id === id));
        return ls.length >= 2;
      });
    }
    /* Forms quiz: "ran" → what's the base word? */
    function usableForForms(list) {
      return list.filter(e => e.forms && e.forms.trim().length > 0);
    }
    function splitForms(str) {
      return (str || '').split(/[·,/|;]+|\s{2,}/).map(s => s.trim()).filter(s => s.length > 0);
    }
    function viewQuiz() {
      if (S.entries.length === 0) {
        return emptyState('🎯', 'Nothing to review yet', 'Save a few words first, then come back to play flashcards, spelling, and fill-in quizzes.');
      }
      const g = S.game;
      const scopeList = scopedEntries();
      const blankable = usableForBlank(scopeList);
      const recallable = usableForRecall(scopeList);
      const oddable = usableForOdd(scopeList);
      const formable = usableForForms(scopeList);
      const scopeStatus = ['All', 'Favorites', 'Active'].map(s => {

      style="${on ? 'background:var(--primary)' : ''}">${emoji} ${esc(s)}</button>`;

      const q = [
        { id: 'recall', ic: '💭', bg: '#EDE9FE', fg: '#7C3AED', name: 'Recall', desc: 'Remember it from the context', ok: recallable.length >= 1 },

        { id: 'blank', ic: '✍️', bg: 'var(--green-soft)', fg: 'var(--green)', name: 'Fill the blank', desc: 'Type the missing word', ok: blankable.length >= 1 },
        { id: 'choice', ic: '🎴', bg: '#FDECF3', fg: '#E8578A', name: 'Multiple choice', desc: 'Pick it from the context', ok: blankable.length >= 1 && scopeList.length >= 2 },
        { id: 'forms', ic: '🔀', bg: '#E0F2FE', fg: '#0284C7', name: 'Word forms', desc: 'Match a form to its base word', ok: formable.length >= 1 },
        { id: 'odd', ic: '🧩', bg: '#FEF3C7', fg: '#B45309', name: 'Odd one out', desc: 'Spot the unrelated word', ok: oddable.length >= 1 && scopeList.length >= 4 },
        { id: 'speed', ic: '⚡', bg: '#FEE2E2', fg: '#DC2626', name: 'Speed round', desc: '60 seconds, as many as you can', ok: scopeList.length >= 4 }
      ];
      const cards = q.map(x => `
    <button class="qcard ${x.ok ? '' : 'locked'}" data-quiz="${x.id}">
      ${x.ok ? '' : '<span class="lock">🔒</span>'}

      return `

    <div class="statrow">
      <div class="stat"><div class="v">${S.entries.length}</div><div class="k">Words</div></div>

      <div class="stat"><div class="v">${g.bestScore}%</div><div class="k">Best quiz</div></div>

    <div class="scopebar">${scopeStatus}</div>
    <div class="scopebar" style="margin-top:-.7rem">${scopeCats}</div>

    ${blankable.length < 1 ? '<p style="text-align:center;color:var(--ink-soft);font-size:.82rem;font-weight:600;margin-top:1.1rem">Add example sentences to unlock typing &amp; multiple-choice quizzes.</p>' : ''}
    </div>`;
    }
