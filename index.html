    /* ============================================================
       BIND — attach events after each render
       ============================================================ */
    function bindView() {
      // tabs
      document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => {
        if (typeof stopSpeedTimer === 'function') stopSpeedTimer();
        S.ui.tab = b.dataset.tab; render(); window.scrollTo(0, 0);
      });

      const t = S.ui.tab;
      if (t === 'register') bindRegister();
      else if (t === 'records') bindRecords();
      else if (t === 'quiz') bindQuiz();
      else if (t === 'settings') bindSettings();

      // shared: add category button
      document.querySelectorAll('[data-action="add-cat"]').forEach(b => b.onclick = openAddCat);
    }

    /* Words queued to link/create alongside the one being written.
       Each item: {word, id|null, rel}  — id set means "link existing", null means "create it too". */
    let pendingRels = [];
    function bindRegister() {
      const wIn = el('in-word'), exIn = el('in-ex'), noteIn = el('in-note'), formsIn = el('in-forms');
      if (regDraft) {
        if (wIn) wIn.value = regDraft.word;
        if (exIn) exIn.value = regDraft.ex;
        if (noteIn) noteIn.value = regDraft.note;
        if (formsIn) formsIn.value = regDraft.forms || '';
        regDraft = null;
      } else if (!regKeepRels) {
        pendingRels = [];
      }
      regKeepRels = false;

      document.querySelectorAll('.cat-chip').forEach(c => c.onclick = () => { S.lastCat = c.dataset.cat; rerenderRegister(); });

      const pickBtn = document.querySelector('[data-action="pick-sub"]');
      if (pickBtn) pickBtn.onclick = () => openSubPicker(S.lastCat);

      if (wIn) {
        wIn.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); exIn.focus(); } };
      }

      /* ---- Related words: search existing, or queue a brand-new word ---- */
      const relIn = el('in-rel'), relDrop = el('rel-drop');
      function drawRelChips() {
        const box = el('rel-chips'); if (!box) return;
        if (pendingRels.length === 0) { box.innerHTML = ''; return; }
        box.innerHTML = pendingRels.map((r, i) => `
      <span class="relchip ${r.id ? 'exist' : 'new'}">
        <button class="relchip-rel" data-relcycle="${i}" title="Tap to label this link">${r.rel ? esc(r.rel) : 'link'}</button>
        <span class="relchip-w">${esc(r.word)}</span>
        ${r.id ? '' : '<span class="relchip-tag">new</span>'}
        <button class="relchip-x" data-relrm="${i}" aria-label="Remove">${I.x}</button>
      </span>`).join('');
        box.querySelectorAll('[data-relrm]').forEach(b => b.onclick = () => {
          pendingRels.splice(+b.dataset.relrm, 1); drawRelChips();
        });
        box.querySelectorAll('[data-relcycle]').forEach(b => b.onclick = () => {
          const i = +b.dataset.relcycle;
          const cur = REL_TYPES.indexOf(pendingRels[i].rel || '');
          pendingRels[i].rel = REL_TYPES[(cur + 1) % REL_TYPES.length];
          drawRelChips();
        });
      }
      function queueRel(word, id) {
        const t = (word || '').trim();
        if (!t) return;
        if ((wIn.value || '').trim().toLowerCase() === t.toLowerCase()) { toast("That's the same word", '🙂'); return; }
        if (pendingRels.some(r => r.word.toLowerCase() === t.toLowerCase())) { toast('Already in the list'); return; }
        pendingRels.push({ word: t, id: id || null, rel: '' });
        relIn.value = ''; relDrop.style.display = 'none';
        drawRelChips();
      }
      function drawRelDrop() {
        if (!relIn) return;
        const q = (relIn.value || '').trim();
        if (!q) { relDrop.style.display = 'none'; return; }
        const ql = q.toLowerCase();
        const already = new Set(pendingRels.map(r => r.word.toLowerCase()));
        const hits = S.entries
          .filter(e => (e.word || '').toLowerCase().includes(ql) && !already.has((e.word || '').toLowerCase()))
          .slice(0, 6);
        const exact = hits.some(e => (e.word || '').toLowerCase() === ql);
        let html = hits.map(e => `
      <button class="reldrop-row" data-relpick="${e.id}">
        <span style="font-family:'Fraunces',serif;font-size:1.02rem">${esc(e.word)}</span>
        <span style="color:var(--ink-soft);font-size:.78rem;font-weight:600">${esc(e.category)}${e.sub ? ' · ' + esc(e.sub) : ''}</span>
      </button>`).join('');
        if (!exact) {
          html += `<button class="reldrop-row newrow" data-relnew="1">
          ${I.plus}<span>Add “<b>${esc(q)}</b>” as a new word too</span>
        </button>`;
        }
        relDrop.innerHTML = html;
        relDrop.style.display = 'block';
        relDrop.querySelectorAll('[data-relpick]').forEach(b => b.onclick = () => {
          const e = S.entries.find(x => x.id === b.dataset.relpick);
          if (e) queueRel(e.word, e.id);
        });
        const nb = relDrop.querySelector('[data-relnew]');
        if (nb) nb.onclick = () => queueRel(relIn.value, null);
      }
      if (relIn) {
        relIn.oninput = drawRelDrop;
        relIn.onkeydown = ev => {
          if (ev.key === 'Enter') {
            ev.preventDefault();
            const q = (relIn.value || '').trim();
            if (!q) return;
            const hit = findByWord(q);
            queueRel(q, hit ? hit.id : null);
          } else if (ev.key === 'Escape') { relDrop.style.display = 'none'; }
        };
        relIn.onblur = () => setTimeout(() => { if (relDrop) relDrop.style.display = 'none'; }, 180);
        relIn.onfocus = drawRelDrop;
      }
      drawRelChips();

      const btn = el('btn-add');
      if (btn) btn.onclick = () => {
        const word = wIn.value.trim();
        if (!word) { toast('Type a word first', '✍️'); wIn.focus(); return; }
        const cat = S.lastCat, sub = S.lastSub[S.lastCat] || '';
        const main = addEntry({
          category: cat, sub, word,
          example: exIn.value, note: noteIn.value, forms: formsIn ? formsIn.value : ''
        });

        // Create any brand-new related words (same category & title), then link them all.
        let created = 0;
        pendingRels.forEach(r => {
          let target = r.id ? S.entries.find(x => x.id === r.id) : null;
          if (!target) target = findByWord(r.word);
          if (!target) {
            target = addEntry({ category: cat, sub, word: r.word, example: '', note: '', forms: '' });
            created++;
          }
          if (target && target.id !== main.id) toggleLink(main.id, target.id, r.rel);
        });
        const linked = pendingRels.length;
        pendingRels = [];
        const cnt = S.entries.length;
        render();
        let msg = `Saved · ${cnt} word${cnt === 1 ? '' : 's'} collected`;
        if (linked) msg = created
          ? `Saved with ${created} new + ${linked - created} linked`
          : `Saved and linked to ${linked} word${linked === 1 ? '' : 's'}`;
        toast(msg, '✅');
        setTimeout(() => { const w = el('in-word'); if (w) w.focus(); }, 60);
      };
    }
    let regKeepRels = false;
    function rerenderRegister() {
      const w = el('in-word'), ex = el('in-ex'), nt = el('in-note'), fm = el('in-forms');
      regDraft = { word: w ? w.value : '', ex: ex ? ex.value : '', note: nt ? nt.value : '', forms: fm ? fm.value : '' };
      regKeepRels = true;   // switching category shouldn't discard queued links
      render();
    }
    function openSubPicker(catName) {
      const c = catOf(catName);
      const subLbl = c.subLabel || 'Item';
      const sel = S.lastSub[catName] || '';
      const rows = (c.subs || []).map(s => `
    <button class="pickrow ${sel === s ? 'on' : ''}" data-pick="${esc(s)}">
      <span>${esc(s)}</span>${sel === s ? '<span class="tick">✓</span>' : ''}
    </button>`).join('');
      const wrap = sheetOverlay(`
    <h3>Choose ${esc(subLbl.toLowerCase())}</h3>
    <div class="picklist">
      <button class="pickrow ${!sel ? 'on' : ''}" data-pick=""><span style="color:var(--ink-soft)">None</span>${!sel ? '<span class="tick">✓</span>' : ''}</button>
      ${rows}
    </div>
    <button class="btn soft" id="pick-add" style="margin-top:.9rem">${I.plus}Add ${esc(subLbl.toLowerCase())}</button>`);
      wrap.querySelectorAll('.pickrow').forEach(b => b.onclick = () => {
        S.lastSub[catName] = b.dataset.pick; save(); wrap.remove(); rerenderRegister();
      });
      wrap.querySelector('#pick-add').onclick = () => {
        wrap.remove();
        openTextPrompt('Add ' + subLbl, subLbl + ' name', '', (val) => {
          if (!val) return;
          const cc = S.cats.find(x => x.name === catName);
          if (cc) { if (!cc.subs) cc.subs = []; if (!cc.subs.some(s => s.toLowerCase() === val.toLowerCase())) cc.subs.push(val); }
          S.lastSub[catName] = val; save(); rerenderRegister();
        });
      };
    }

    function bindRecords() {
      const s = el('in-search');
      if (s) { s.oninput = () => { S.ui.q = s.value; refreshRecordsList(); }; }
      document.querySelectorAll('[data-filter]').forEach(b => b.onclick = () => {
        S.ui.filter = b.dataset.filter;
        S.ui.subFilter = 'All';        // titles differ per category, so start fresh
        render();
      });
      const sortBtn = document.querySelector('[data-action="toggle-sort"]');
      if (sortBtn) sortBtn.onclick = () => { S.ui.sort = S.ui.sort === 'newest' ? 'oldest' : 'newest'; render(); };
      const subBtn = document.querySelector('[data-action="pick-subfilter"]');
      if (subBtn) subBtn.onclick = openSubFilterPicker;
      bindEntryActions();
    }
    function openSubFilterPicker() {
      const subs = availableSubs();
      const cur = S.ui.subFilter;
      const rows = subs.map(s => `
    <button class="pickrow ${cur === s ? 'on' : ''}" data-pickfilter="${esc(s)}">
      <span>${esc(s)}</span>${cur === s ? '<span class="tick">✓</span>' : ''}
    </button>`).join('');
      const wrap = sheetOverlay(`
    <h3>Filter by title</h3>
    <div class="picklist">
      <button class="pickrow ${cur === 'All' ? 'on' : ''}" data-pickfilter="All"><span>All titles</span>${cur === 'All' ? '<span class="tick">✓</span>' : ''}</button>
      ${rows}
      <button class="pickrow ${cur === '__none__' ? 'on' : ''}" data-pickfilter="__none__"><span style="color:var(--ink-soft)">No title</span>${cur === '__none__' ? '<span class="tick">✓</span>' : ''}</button>
    </div>`);
      wrap.querySelectorAll('[data-pickfilter]').forEach(b => b.onclick = () => {
        S.ui.subFilter = b.dataset.pickfilter; wrap.remove(); render();
      });
    }
    function refreshRecordsList() {
      const list = filteredEntries();
      const rows = list.length ? list.map(entryRow).join('') : `<div class="empty" style="padding:2.5rem 1rem"><p>No words match this view.</p></div>`;
      const c = document.querySelector('.toolbar .count'); if (c) c.textContent = `${list.length} shown`;
      const grid = el('rec-list'); if (grid) { grid.innerHTML = rows; bindEntryActions(); }
    }
    function bindEntryActions() {
      document.querySelectorAll('.act').forEach(b => b.onclick = (ev) => {
        ev.stopPropagation();
        const id = b.dataset.id, act = b.dataset.act;
        const e = S.entries.find(x => x.id === id); if (!e) return;
        if (act === 'fav') { updateEntry(id, { fav: !e.fav }); toast(e.fav ? 'Removed from favorites' : 'Added to favorites', e.fav ? '☆' : '⭐'); render(); }
        else if (act === 'done') { updateEntry(id, { done: !e.done }); if (!e.done) { touchStreak(); save(); } toast(e.done ? 'Back to review' : 'Marked as learned', e.done ? '↩️' : '✅'); render(); }
        else if (act === 'link') { openLinkPicker(id); }
        else if (act === 'edit') { openEdit(id); }
        else if (act === 'del') { openConfirmDelete(id); }
      });
      // tapping a linked word jumps to it
      document.querySelectorAll('[data-goto]').forEach(b => b.onclick = (ev) => {
        ev.stopPropagation();
        const t = S.entries.find(x => x.id === b.dataset.goto);
        if (!t) return;
        S.ui.filter = 'All'; S.ui.subFilter = 'All'; S.ui.q = t.word;
        render();
        toast('Jumped to "' + t.word + '"', '🔗');
      });
    }
    /* Connect related words — mutual, searchable, any number of links. */
    function openLinkPicker(id) {
      const e = S.entries.find(x => x.id === id); if (!e) return;
      let q = '';
      const wrap = sheetOverlay(`
    <h3>Link related words</h3>
    <p style="color:var(--ink-soft);font-size:.88rem;line-height:1.5;margin:-.6rem 0 1rem">
      Connect <b>${esc(e.word)}</b> to synonyms, opposites, or words from the same scene. Links work both ways.</p>
    <div class="searchwrap" style="margin-bottom:.7rem">${I.search}
      <input class="search" id="lk-q" placeholder="Search your words" autocomplete="off"></div>
    <div class="picklist" id="lk-list"></div>`);
      const listEl = wrap.querySelector('#lk-list');
      function draw() {
        const cur = S.entries.find(x => x.id === id);
        const linkSet = new Set(linksOf(cur));
        const needle = q.trim().toLowerCase();
        let pool = S.entries.filter(x => x.id !== id);
        if (needle) pool = pool.filter(x => (x.word || '').toLowerCase().includes(needle));
        // linked ones first, then most recent
        pool.sort((a, b) => {
          const la = linkSet.has(a.id) ? 0 : 1, lb = linkSet.has(b.id) ? 0 : 1;
          return la !== lb ? la - lb : b.date - a.date;
        });
        pool = pool.slice(0, 40);
        if (pool.length === 0) {
          listEl.innerHTML = `<div style="color:var(--ink-soft);padding:1rem;text-align:center;font-weight:600">${S.entries.length < 2 ? 'Save another word first — you need two to make a link.' : 'No words match that search.'}</div>`;
          return;
        }
        listEl.innerHTML = pool.map(x => {
          const on = linkSet.has(x.id);
          const r = on ? relOf(cur, x.id) : '';
          return `<button class="pickrow ${on ? 'on' : ''}" data-link="${x.id}">
        <span><span style="font-family:'Fraunces',serif">${esc(x.word)}</span>
        ${x.sub ? `<span style="color:var(--ink-soft);font-size:.8rem;font-weight:600"> · ${esc(x.sub)}</span>` : ''}</span>
        ${on ? `<span style="display:flex;align-items:center;gap:.4rem"><span class="relchip-rel" data-setrel="${x.id}">${r ? esc(r) : 'label'}</span><span class="tick">✓</span></span>`
              : '<span style="color:var(--ink-soft);font-size:.85rem">+ link</span>'}
      </button>`;
        }).join('');
        listEl.querySelectorAll('[data-link]').forEach(b => b.onclick = (ev) => {
          if (ev.target.closest('[data-setrel]')) return;   // label taps handled below
          const added = toggleLink(id, b.dataset.link);
          const other = S.entries.find(x => x.id === b.dataset.link);
          toast(added ? `Linked to "${other.word}"` : `Unlinked "${other.word}"`, added ? '🔗' : '✂️');
          draw();
        });
        listEl.querySelectorAll('[data-setrel]').forEach(b => b.onclick = (ev) => {
          ev.stopPropagation();
          const otherId = b.dataset.setrel;
          const curRel = relOf(S.entries.find(x => x.id === id), otherId);
          const next = REL_TYPES[(REL_TYPES.indexOf(curRel || '') + 1) % REL_TYPES.length];
          setRel(id, otherId, next);
          draw();
        });
      }
      const qi = wrap.querySelector('#lk-q');
      qi.oninput = () => { q = qi.value; draw(); };
      draw();
      wrap.addEventListener('click', ev => { if (ev.target === wrap) render(); }, true);
    }

    function bindQuiz() {
      document.querySelectorAll('[data-scope]').forEach(b => b.onclick = () => { S.ui.scope = b.dataset.scope; render(); });
      document.querySelectorAll('[data-quiz]').forEach(b => b.onclick = () => startQuiz(b.dataset.quiz));
    }

    function bindSettings() {
      document.querySelectorAll('#fs-seg button').forEach(b => b.onclick = () => {
        S.settings.fs = b.dataset.fs; save(); applyChrome(); render();
      });
      const sw = el('sw-theme'); if (sw) sw.onclick = () => {
        S.settings.theme = S.settings.theme === 'dark' ? 'light' : 'dark'; save(); applyChrome(); render();
      };
      document.querySelectorAll('[data-editcat]').forEach(b => b.onclick = () => openManageCat(b.dataset.editcat));
      const so = el('btn-signout'); if (so) so.onclick = () => {
        signOutFirebase();
        S.settings.guestMode = false; save();
        toast('Signed out', '👋');
        showAuthGate('choice');
        render();
      };
      const li = el('btn-login'); if (li) li.onclick = () => { showAuthGate(S.settings.guestMode ? 'in' : 'choice'); };
      const ex = el('btn-export'); if (ex) ex.onclick = exportData;
      const im = el('btn-import'); if (im) im.onclick = importData;
      const cl = el('btn-clear'); if (cl) cl.onclick = () => {
        openConfirm('Clear everything?', 'This deletes all saved words on this device. Synced copies in Firebase/Sheets are not touched.', 'Clear all', () => {
          S.entries = []; save(); render(); toast('All words cleared', '🧹');
        });
      };
    }

    /* ============================================================
       MODALS
       ============================================================ */
    function closeModal() { el('modal-root').innerHTML = ''; }
    function modal(html) {
      el('modal-root').innerHTML = `<div class="modal-bg" id="mbg"><div class="modal"><div class="grab"></div>${html}</div></div>`;
      el('mbg').onclick = e => { if (e.target.id === 'mbg') closeModal(); };
    }
    function openEdit(id) {
      const e = S.entries.find(x => x.id === id); if (!e) return;
      let cat = e.category, sub = e.sub || '';
      const catChips = S.cats.map(c => `<button class="chip ec ${cat === c.name ? 'on' : ''}" data-ec="${esc(c.name)}" style="${cat === c.name ? `background:${c.color}` : ''}">${c.emoji} ${esc(c.name)}</button>`).join('');
      modal(`
    <h3>Edit word</h3>
    <div class="field"><label>Category</label><div class="filterrow" id="ec-row">${catChips}</div></div>
    <div class="field"><label id="es-label"></label><div class="filterrow" id="es-row"></div></div>
    <div class="field"><label>Word</label><input class="input wordinput" id="ed-word" value="${esc(e.word)}"></div>
    <div class="field"><label>Other forms</label><input class="input" id="ed-forms" value="${esc(e.forms || '')}" placeholder="e.g. ran · running · runs"></div>
    <div class="field"><label>Example</label><textarea class="area" id="ed-ex">${esc(e.example)}</textarea></div>
    <div class="field"><label>Note</label><input class="input" id="ed-note" value="${esc(e.note)}"></div>
    <div class="row2">
      <button class="btn ghost" id="ed-cancel">Cancel</button>
      <button class="btn" id="ed-save">Save changes</button>
    </div>`);
      function drawSubs() {
        const c = catOf(cat);
        el('es-label').innerHTML = `${esc(c.subLabel || 'Source')}`;
        const chips = (c.subs || []).map(s => `<button class="chip es ${sub === s ? 'on' : ''}" data-es="${esc(s)}" style="${sub === s ? `background:${c.color}` : ''}">${esc(s)}</button>`).join('');
        el('es-row').innerHTML = chips + `<button class="chip" id="es-add">${I.plus}Add</button>`;
        document.querySelectorAll('.es').forEach(b => b.onclick = () => { sub = (sub === b.dataset.es) ? '' : b.dataset.es; drawSubs(); });
        el('es-add').onclick = () => openTextPrompt('Add ' + (c.subLabel || 'item'), c.subLabel || 'Name', '', (val) => {
          if (!val) return;
          const cc = S.cats.find(x => x.name === cat);
          if (cc) { if (!cc.subs) cc.subs = []; if (!cc.subs.some(s => s.toLowerCase() === val.toLowerCase())) cc.subs.push(val); }
          sub = val; save(); drawSubs();
        });
      }
      document.querySelectorAll('.ec').forEach(b => b.onclick = () => {
        cat = b.dataset.ec; sub = '';
        document.querySelectorAll('.ec').forEach(x => { x.classList.remove('on'); x.style.background = ''; });
        b.classList.add('on'); b.style.background = catOf(cat).color;
        drawSubs();
      });
      drawSubs();
      el('ed-cancel').onclick = closeModal;
      el('ed-save').onclick = () => {
        const w = el('ed-word').value.trim();
        if (!w) { toast('Word can\'t be empty'); return; }
        updateEntry(id, {
          category: cat, sub, word: w, example: el('ed-ex').value.trim(),
          note: el('ed-note').value.trim(), forms: el('ed-forms').value.trim()
        });
        closeModal(); render(); toast('Updated', '✏️');
      };
    }
    function openConfirmDelete(id) {
      const e = S.entries.find(x => x.id === id); if (!e) return;
      openConfirm('Delete this word?', `"${e.word}" will be removed everywhere it's synced.`, 'Delete', () => {
        deleteEntry(id); render(); toast('Deleted', '🗑️');
      }, true);
    }
    function openConfirm(title, text, label, onYes, danger) {
      modal(`
    <h3>${esc(title)}</h3>
    <p style="color:var(--ink-soft);line-height:1.55;margin-bottom:1.3rem">${esc(text)}</p>
    <div class="row2">
      <button class="btn ghost" id="cf-no">Cancel</button>
      <button class="btn ${danger ? 'danger' : ''}" id="cf-yes">${esc(label)}</button>
    </div>`);
      el('cf-no').onclick = closeModal;
      el('cf-yes').onclick = () => { closeModal(); onYes(); };
    }
    function openAddCat() {
      const usedColors = S.cats.map(c => c.color);
      const color = CAT_COLORS.find(c => !usedColors.includes(c)) || CAT_COLORS[Math.floor(Math.random() * CAT_COLORS.length)];
      modal(`
    <h3>New category</h3>
    <div class="field"><label>Name</label><input class="input" id="nc-name" placeholder="e.g. YouTube, Work, Song" autocomplete="off"></div>
    <div class="field"><label>Emoji</label><input class="input" id="nc-emoji" placeholder="🎵" maxlength="2" value="🏷️"></div>
    <div class="row2"><button class="btn ghost" id="nc-cancel">Cancel</button><button class="btn" id="nc-save">Add category</button></div>`);
      el('nc-cancel').onclick = closeModal;
      el('nc-save').onclick = () => {
        const name = el('nc-name').value.trim();
        if (!name) { toast('Give it a name'); return; }
        if (S.cats.some(c => c.name.toLowerCase() === name.toLowerCase())) { toast('That category exists'); return; }
        const emoji = el('nc-emoji').value.trim() || '🏷️';
        S.cats.push({ name, color, emoji });
        S.lastCat = name; save(); closeModal(); render(); toast('Category added', '🏷️');
      };
      setTimeout(() => { const n = el('nc-name'); if (n) n.focus(); }, 60);
    }

    /* ============================================================
       EXPORT / IMPORT
       ============================================================ */
    function exportData() {
      const blob = new Blob([JSON.stringify({ entries: S.entries, cats: S.cats, game: S.game }, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `wordbook-backup-${todayKey()}.json`; a.click();
      URL.revokeObjectURL(url); toast('Backup downloaded', '💾');
    }
    function importData() {
      const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json';
      inp.onchange = () => {
        const f = inp.files[0]; if (!f) return;
        const r = new FileReader();
        r.onload = () => {
          try {
            const d = JSON.parse(r.result);
            if (!d.entries) throw 0;
            const map = {}; S.entries.forEach(e => map[e.id] = e);
            d.entries.forEach(e => { if (e && e.id) map[e.id] = e; });
            S.entries = Object.values(map);
            if (d.cats && d.cats.length) S.cats = d.cats;
            save(); render(); toast(`Imported ${d.entries.length} words`, '📥');
          } catch (e) { toast('That file didn\'t look right'); }
        };
        r.readAsText(f);
      };
      inp.click();
    }

    /* ============================================================
       QUIZ ENGINE
       ============================================================ */
    let Q = null, speedTimer = null;
    function startQuiz(type) {
      let pool = scopedEntries();
      if (type === 'blank' || type === 'choice') pool = usableForBlank(pool);
      else if (type === 'recall') pool = usableForRecall(pool);
      else if (type === 'odd') pool = usableForOdd(pool);
      else if (type === 'forms') pool = usableForForms(pool);
      if (pool.length === 0) { toast('Not enough words for this quiz'); return; }
      const cap = type === 'speed' ? Math.min(60, pool.length) : Math.min(12, pool.length);
      const items = shuffle(pool).slice(0, cap);
      Q = {
        type, items, i: 0, correct: 0, combo: 0, bestCombo: 0, answered: false,
        allWords: S.entries.map(e => e.word), timeLeft: type === 'speed' ? 60 : null, ended: false
      };
      if (type === 'speed') startSpeedTimer();
      renderQuizSession();
    }
    function startSpeedTimer() {
      clearInterval(speedTimer);
      speedTimer = setInterval(() => {
        if (!Q || Q.type !== 'speed') { clearInterval(speedTimer); return; }
        Q.timeLeft--;
        const t = el('q-timer');
        if (t) {
          t.textContent = Q.timeLeft + 's';
          t.classList.toggle('low', Q.timeLeft <= 10);
        }
        if (Q.timeLeft <= 0) { stopSpeedTimer(); Q.ended = true; renderResults(); }
      }, 1000);
    }
    function stopSpeedTimer() { clearInterval(speedTimer); speedTimer = null; }
    function endQuizOverlay() { stopSpeedTimer(); el('overlay-root').innerHTML = ''; Q = null; render(); }

    function renderQuizSession() {
      if (!Q) return;
      if (Q.i >= Q.items.length) { return renderResults(); }
      const total = Q.items.length, pct = Math.round((Q.i / total) * 100);
      const comboHtml = Q.combo > 1 ? `<div class="combo">🔥${Q.combo}</div>` : `<div class="combo"></div>`;
      let body = '';
      if (Q.type === 'flash') body = renderFlash();
      else if (Q.type === 'scramble') body = renderScramble();
      else if (Q.type === 'blank') body = renderBlank();
      else if (Q.type === 'choice') body = renderChoice();
      else if (Q.type === 'recall') body = renderRecall();
      else if (Q.type === 'odd') body = renderOdd();
      else if (Q.type === 'forms') body = renderForms();
      else if (Q.type === 'speed') body = renderSpeed();

      const head = Q.type === 'speed'
        ? `<div class="qtimer ${Q.timeLeft <= 10 ? 'low' : ''}" id="q-timer">${Q.timeLeft}s</div>`
        : `<div class="progress"><i style="width:${pct}%"></i></div>`;

      el('overlay-root').innerHTML = `
    <div class="overlay">
      <div class="qhead">
        <button class="iconbtn" id="q-close">${I.close}</button>
        ${head}
        ${comboHtml}
      </div>
      <div class="qbody" id="q-body">${body}</div>
      <div class="qfoot" id="q-foot"></div>
    </div>`;
      el('q-close').onclick = () => { openConfirm('Leave the quiz?', 'Your streak and progress in this round won\'t be saved.', 'Leave', endQuizOverlay); };
      bindQuizStep();
    }

    /* --- Flashcards --- */
    function renderFlash() {
      const e = Q.items[Q.i];
      return `
    <div class="qmeta"><span class="cat-badge" style="background:${catOf(e.category).color}1f;color:${catOf(e.category).color}">${catOf(e.category).emoji} ${esc(e.category)}</span>${e.sub ? `<span style="color:var(--ink-soft);font-weight:600;margin-left:.5rem;font-size:.82rem">${esc(e.sub)}</span>` : ''}</div>
    <div class="flashcard">
      <div class="fc-inner" id="fc">
        <div class="fc-face"><div class="fw">${esc(e.word)}</div><div class="fc-hint">tap to reveal</div></div>
        <div class="fc-face fc-back">
          <span class="eyebrow">Meaning &amp; usage</span>
          <div class="bw">${esc(e.word)}</div>
          ${e.forms ? `<div style="font-family:'Fraunces',serif;font-style:italic;color:var(--ink-soft);font-size:.95rem">${esc(e.forms)}</div>` : ''}
          ${e.example ? `<div class="bex">"${esc(e.example)}"</div>` : '<div class="bex">No example saved yet.</div>'}
          ${e.note ? `<div class="bnote">${esc(e.note)}</div>` : ''}
          ${linkedEntries(e).length ? `<div class="linkrow" style="justify-content:center">${I.link}${linkedEntries(e).map(l => `<span class="linkchip">${esc(l.word)}</span>`).join('')}</div>` : ''}
        </div>
      </div>
    </div>`;
    }
    /* --- Scramble --- */
    function renderScramble() {
      const e = Q.items[Q.i];
      const word = e.word;
      const multi = word.trim().includes(' ');
      let pieces;
      if (multi) { pieces = word.trim().split(/\s+/); }
      else { pieces = word.split(''); }
      // ensure shuffle differs
      let sh = shuffle(pieces);
      if (pieces.length > 1 && sh.join('') === pieces.join('')) sh = shuffle(pieces);
      Q._pieces = pieces; Q._multi = multi; Q._picked = [];
      const tiles = sh.map((p, idx) => `<button class="tile" data-tile="${idx}" data-val="${esc(p)}">${esc(p)}</button>`).join(multi ? ' ' : '');
      const exHtml = e.example ? blankOutHtml(e.example, word) : '';
      const showEx = exHtml && exHtml !== esc(e.example || '');   // only show if the answer got blanked
      return `
    <div class="qmeta">
      <span class="eyebrow">Unscramble</span>
      ${showEx
          ? `<p style="color:var(--ink-soft);font-style:italic;margin-top:.7rem;line-height:1.6">"${exHtml}"</p>`
          : '<p style="color:var(--ink-soft);margin-top:.5rem">Rebuild the expression from the pieces</p>'}
    </div>
    <div class="answer-slots" id="slots"><span style="color:var(--ink-soft);font-style:italic">tap the pieces →</span></div>
    <div class="tiles" id="tiles">${tiles}</div>`;
    }
    /* --- Fill the blank (typing) --- */
    function renderBlank() {
      const e = Q.items[Q.i];
      return `
    <div class="qmeta"><span class="eyebrow">Fill the blank</span></div>
    <div class="qprompt">${blankPrompt(e.example, e.word)}</div>
    ${e.note ? `<p style="text-align:center;color:var(--ink-soft);margin-top:.7rem">Hint: ${esc(e.note)}</p>` : ''}
    <div style="margin-top:1.6rem">
      <input class="input wordinput" id="blank-in" placeholder="type here" autocomplete="off" autocapitalize="none" spellcheck="false" style="text-align:center">
    </div>`;
    }
    /* --- Multiple choice --- */
    function renderChoice() {
      const e = Q.items[Q.i];
      const others = shuffle(S.entries.filter(x => x.id !== e.id && x.word.toLowerCase() !== e.word.toLowerCase()).map(x => x.word));
      const opts = shuffle([e.word, ...others.slice(0, 3)]);
      Q._answer = e.word;
      return `
    <div class="qmeta"><span class="eyebrow">Which word fits?</span></div>
    <div class="qprompt">${blankPrompt(e.example, e.word)}</div>
    <div class="opts" id="opts">
      ${opts.map(o => `<button class="opt" data-opt="${esc(o)}">${esc(o)}</button>`).join('')}
    </div>`;
    }

    /* --- Recall: see the context, retrieve the word from memory --- */
    function renderRecall() {
      const e = Q.items[Q.i];
      // Any clue containing the answer would give it away, so mask it everywhere.
      const mask = (txt) => blankOutHtml(txt, e.word);
      const leaks = (txt) => (txt || '').toLowerCase().includes((e.word || '').toLowerCase());
      const clues = [];
      if (e.example) clues.push(`<p class="rc-ex">"${mask(e.example)}"</p>`);
      if (e.note) clues.push(`<p class="rc-note">${leaks(e.note) ? mask(e.note) : esc(e.note)}</p>`);
      if (e.forms) {
        // Forms usually share the stem, so only show ones that don't contain the word itself.
        const safe = splitForms(e.forms).filter(f => !leaks(f));
        if (safe.length) clues.push(`<p class="rc-forms">forms: ${esc(safe.join(' · '))}</p>`);
      }
      const linked = linkedEntries(e).filter(l => !leaks(l.word) && !(e.word || '').toLowerCase().includes((l.word || '').toLowerCase()));
      if (linked.length) clues.push(`<p class="rc-links">related: ${linked.map(l => esc(l.word)).join(', ')}</p>`);
      if (clues.length === 0) clues.push(`<p class="rc-ex" style="color:var(--ink-soft)">No clue left that doesn't give it away — take a guess, then reveal.</p>`);
      return `
    <div class="qmeta"><span class="eyebrow">Recall</span>
      <p style="color:var(--ink-soft);font-size:.86rem;margin-top:.4rem">Which word fits here?</p></div>
    <div class="recallbox">${clues.join('')}</div>
    <div class="rc-answer" id="rc-answer" style="display:none">
      <span class="eyebrow">The word was</span>
      <div class="rc-word">${esc(e.word)}</div>
    </div>`;
    }
    /* --- Word forms: given an inflected form, name the base word --- */
    function renderForms() {
      const e = Q.items[Q.i];
      const parts = splitForms(e.forms);
      const shown = parts.length ? parts[Math.floor(Math.random() * parts.length)] : e.forms;
      Q._answer = e.word;
      return `
    <div class="qmeta"><span class="eyebrow">Word forms</span>
      <p style="color:var(--ink-soft);font-size:.86rem;margin-top:.4rem">What's the base word?</p></div>
    <div class="qbig">${esc(shown)}</div>
    <div style="margin-top:1.6rem">
      <input class="input wordinput" id="forms-in" placeholder="type the base word" autocomplete="off"
        autocapitalize="none" spellcheck="false" style="text-align:center">
    </div>`;
    }
    /* --- Odd one out: three linked words plus one outsider --- */
    function renderOdd() {
      const e = Q.items[Q.i];
      const family = linkedEntries(e).slice(0, 2);
      const famIds = new Set([e.id, ...family.map(f => f.id)]);
      const outsiders = shuffle(S.entries.filter(x => !famIds.has(x.id) && !linksOf(e).includes(x.id)));
      const odd = outsiders[0];
      Q._answer = odd ? odd.word : null;
      if (!odd) { // not enough contrast — skip gracefully
        return `<div class="qmeta"><span class="eyebrow">Odd one out</span></div>
      <p style="text-align:center;color:var(--ink-soft);margin:auto 0">Not enough words to contrast. Tap Next.</p>`;
      }
      const opts = shuffle([e, ...family, odd]);
      return `
    <div class="qmeta"><span class="eyebrow">Odd one out</span>
      <p style="color:var(--ink-soft);font-size:.86rem;margin-top:.4rem">Three of these are connected. Which one isn't?</p></div>
    <div class="opts" id="opts">
      ${opts.map(o => `<button class="opt" data-opt="${esc(o.word)}">${esc(o.word)}</button>`).join('')}
    </div>`;
    }
    /* --- Speed round: rapid-fire recognition, 60 seconds --- */
    function renderSpeed() {
      const e = Q.items[Q.i];
      const others = shuffle(S.entries.filter(x => x.id !== e.id && x.word.toLowerCase() !== e.word.toLowerCase()));
      const opts = shuffle([e.word, ...others.slice(0, 2).map(x => x.word)]);
      Q._answer = e.word;
      const leaks = (t) => (t || '').toLowerCase().includes((e.word || '').toLowerCase());
      const hint = e.example ? blankOutHtml(e.example, e.word)
        : (e.note && !leaks(e.note) ? esc(e.note)
          : (e.forms && !leaks(e.forms) ? 'forms: ' + esc(e.forms) : 'Which word have you saved?'));
      return `
    <div class="qmeta"><span class="eyebrow">Speed round · ${Q.correct} correct</span></div>
    <div class="qprompt">${hint}</div>
    <div class="opts" id="opts">
      ${opts.map(o => `<button class="opt" data-opt="${esc(o)}">${esc(o)}</button>`).join('')}
    </div>`;
    }

    function blankOut(sentence, word) {
      const re = new RegExp(escapeReg(word), 'ig');
      return sentence.replace(re, '_____');
    }
    function blankOutHtml(sentence, word) {
      const safe = esc(sentence);
      const reE = new RegExp(escapeReg(esc(word)), 'i');
      return safe.replace(reE, '<span class="blank">____</span>');
    }
    function blankPrompt(sentence, word) {
      const re = new RegExp('(' + escapeReg(word) + ')', 'i');
      const safe = esc(sentence);
      // rebuild with blank on escaped string
      const reE = new RegExp(escapeReg(esc(word)), 'i');
      return safe.replace(reE, '<span class="blank">?</span>');
    }
    function escapeReg(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

    function bindQuizStep() {
      const foot = el('q-foot');
      if (Q.type === 'flash') {
        const fc = el('fc'); let flipped = false;
        fc.onclick = () => { flipped = !flipped; fc.classList.toggle('flipped', flipped); };
        foot.innerHTML = `<button class="btn ghost" id="q-again">Review again</button><button class="btn" id="q-got">Got it 👍</button>`;
        el('q-again').onclick = () => { next(false, true); };
        el('q-got').onclick = () => { next(true, true); };
      }
      else if (Q.type === 'scramble') {
        const slots = el('slots'), tiles = el('tiles');
        document.querySelectorAll('.tile').forEach(t => t.onclick = () => {
          if (t.classList.contains('used')) return;
          t.classList.add('used');
          Q._picked.push({ idx: t.dataset.tile, val: t.dataset.val });
          drawSlots();
        });
        function drawSlots() {
          if (Q._picked.length === 0) { slots.innerHTML = '<span style="color:var(--ink-soft);font-style:italic">tap the pieces →</span>'; }
          else slots.innerHTML = Q._picked.map((p, i) => `<span class="slot" data-pick="${i}">${esc(p.val)}</span>`).join(Q._multi ? ' ' : '');
          document.querySelectorAll('.slot').forEach(s => s.onclick = () => {
            const i = +s.dataset.pick; const removed = Q._picked.splice(i, 1)[0];
            const tile = document.querySelector(`.tile[data-tile="${removed.idx}"]`);
            if (tile) tile.classList.remove('used');
            drawSlots();
          });
          const attempt = Q._picked.map(p => p.val).join(Q._multi ? ' ' : '');
          const target = Q._pieces.join(Q._multi ? ' ' : '');
          const done = Q._picked.length === Q._pieces.length;
          foot.innerHTML = `<button class="btn" id="q-check" ${done ? '' : 'disabled'}>Check</button>`;
          const cb = el('q-check'); if (cb) cb.onclick = () => {
            const ok = attempt.toLowerCase() === target.toLowerCase();
            showAnswer(ok, Q.items[Q.i].word);
          };
        }
        drawSlots();
      }
      else if (Q.type === 'blank') {
        const inp = el('blank-in');
        foot.innerHTML = `<button class="btn" id="q-check">Check</button>`;
        const submit = () => {
          const val = (inp.value || '').trim().toLowerCase();
          if (!val) { toast('Type your answer'); return; }
          const ok = val === Q.items[Q.i].word.trim().toLowerCase();
          showAnswer(ok, Q.items[Q.i].word);
        };
        el('q-check').onclick = submit;
        inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); submit(); } };
        setTimeout(() => inp.focus(), 80);
      }
      else if (Q.type === 'choice') {
        foot.innerHTML = '';
        document.querySelectorAll('.opt').forEach(o => o.onclick = () => {
          if (Q.answered) return;
          Q.answered = true;
          const chosen = o.dataset.opt;
          const ok = chosen.toLowerCase() === Q._answer.toLowerCase();
          document.querySelectorAll('.opt').forEach(x => {
            if (x.dataset.opt.toLowerCase() === Q._answer.toLowerCase()) x.classList.add('correct');
            else if (x === o) x.classList.add('wrong');
            else x.classList.add('dim');
          });
          scoreTick(ok);
          foot.innerHTML = `<button class="btn" id="q-next">${Q.i + 1 >= Q.items.length ? 'See results' : 'Next'}</button>`;
          el('q-next').onclick = () => advance();
        });
      }
      else if (Q.type === 'recall') {
        // Self-graded retrieval: think first, then reveal and judge honestly.
        foot.innerHTML = `<button class="btn" id="q-reveal">Show the word</button>`;
        el('q-reveal').onclick = () => {
          const a = el('rc-answer');
          if (a) a.style.display = 'block';
          foot.innerHTML = `<button class="btn ghost" id="q-miss">Didn't get it</button><button class="btn" id="q-hit">I knew it 👍</button>`;
          el('q-miss').onclick = () => { scoreTick(false); advance(); };
          el('q-hit').onclick = () => { scoreTick(true); advance(); };
        };
      }
      else if (Q.type === 'forms') {
        const inp = el('forms-in');
        foot.innerHTML = `<button class="btn" id="q-check">Check</button>`;
        const submit = () => {
          const val = (inp.value || '').trim().toLowerCase();
          if (!val) { toast('Type your answer'); return; }
          showAnswer(val === Q._answer.trim().toLowerCase(), Q._answer);
        };
        el('q-check').onclick = submit;
        inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); submit(); } };
        setTimeout(() => inp.focus(), 80);
      }
      else if (Q.type === 'odd') {
        if (!Q._answer) {   // couldn't build a contrast set
          foot.innerHTML = `<button class="btn" id="q-next">Next</button>`;
          el('q-next').onclick = () => advance();
          return;
        }
        foot.innerHTML = '';
        document.querySelectorAll('.opt').forEach(o => o.onclick = () => {
          if (Q.answered) return;
          Q.answered = true;
          const ok = o.dataset.opt.toLowerCase() === Q._answer.toLowerCase();
          document.querySelectorAll('.opt').forEach(x => {
            if (x.dataset.opt.toLowerCase() === Q._answer.toLowerCase()) x.classList.add('correct');
            else if (x === o) x.classList.add('wrong');
            else x.classList.add('dim');
          });
          scoreTick(ok);
          foot.innerHTML = `<button class="btn" id="q-next">${Q.i + 1 >= Q.items.length ? 'See results' : 'Next'}</button>`;
          el('q-next').onclick = () => advance();
        });
      }
      else if (Q.type === 'speed') {
        // No confirm step — tap and it moves straight on, to keep the pace up.
        foot.innerHTML = '<p style="text-align:center;color:var(--ink-soft);font-size:.82rem;font-weight:600;width:100%">Tap fast — no penalty for wrong answers</p>';
        document.querySelectorAll('.opt').forEach(o => o.onclick = () => {
          if (Q.answered || Q.ended) return;
          Q.answered = true;
          const ok = o.dataset.opt.toLowerCase() === Q._answer.toLowerCase();
          o.classList.add(ok ? 'correct' : 'wrong');
          if (!ok) {
            const right = [...document.querySelectorAll('.opt')].find(x => x.dataset.opt.toLowerCase() === Q._answer.toLowerCase());
            if (right) right.classList.add('correct');
          }
          scoreTick(ok);
          setTimeout(() => {
            if (!Q || Q.ended) return;
            if (Q.i + 1 >= Q.items.length) { stopSpeedTimer(); renderResults(); }
            else advance();
          }, ok ? 260 : 650);
        });
      }
    }

    function showAnswer(ok, word) {
      Q.answered = true;
      scoreTick(ok);
      const body = el('q-body');
      const fb = document.createElement('div');
      fb.className = 'feedback ' + (ok ? 'ok' : 'no');
      fb.innerHTML = ok ? '✅ Nailed it!' : `❌ It was <span class="serif" style="font-weight:600">${esc(word)}</span>`;
      body.appendChild(fb);
      document.querySelectorAll('.tile,.slot,#blank-in,.opt').forEach(n => n.style.pointerEvents = 'none');
      el('q-foot').innerHTML = `<button class="btn" id="q-next">${Q.i + 1 >= Q.items.length ? 'See results' : 'Next'}</button>`;
      el('q-next').onclick = () => advance();
    }
    function scoreTick(ok) {
      if (ok) { Q.correct++; Q.combo++; if (Q.combo > Q.bestCombo) Q.bestCombo = Q.combo; }
      else { Q.combo = 0; }
      const c = document.querySelector('.combo');
      if (c) c.innerHTML = Q.combo > 1 ? `🔥${Q.combo}` : '';
    }
    function next(ok, isFlash) { if (isFlash) scoreTick(ok); advance(); }
    function advance() { Q.i++; Q.answered = false; renderQuizSession(); }

    function renderResults() {
      stopSpeedTimer();
      const isSpeed = Q.type === 'speed';
      const attempted = isSpeed ? Math.max(Q.i, Q.correct) : Q.items.length;
      const total = attempted || 1;
      const pct = Math.round((Q.correct / total) * 100);
      const xpGain = Q.correct * 10 + Q.bestCombo * 5;
      S.game.xp += xpGain;
      if (isSpeed) {
        if (Q.correct > (S.game.bestSpeed || 0)) S.game.bestSpeed = Q.correct;
      } else if (pct > S.game.bestScore) S.game.bestScore = pct;
      touchStreak();
      save();
      const emoji = isSpeed
        ? (Q.correct >= 15 ? '⚡' : Q.correct >= 8 ? '🎉' : '🌱')
        : (pct >= 90 ? '🏆' : pct >= 70 ? '🎉' : pct >= 40 ? '👍' : '🌱');
      const msg = isSpeed
        ? (Q.correct >= 15 ? 'Lightning fast!' : Q.correct >= 8 ? 'Great pace!' : 'Keep going!')
        : (pct >= 90 ? 'Outstanding!' : pct >= 70 ? 'Great work!' : pct >= 40 ? 'Nice effort!' : 'Keep going!');
      const scoreLine = isSpeed
        ? `<div class="score">${Q.correct}</div><div class="sub">correct in 60s · best combo 🔥${Q.bestCombo}${S.game.bestSpeed ? ` · record ${S.game.bestSpeed}` : ''}</div>`
        : `<div class="score">${Q.correct}/${total}</div><div class="sub">${pct}% correct · best combo 🔥${Q.bestCombo}</div>`;
      el('overlay-root').innerHTML = `
    <div class="overlay">
      <div class="results">
        <div class="big">${emoji}</div>
        <h2>${msg}</h2>
        ${scoreLine}
        <div class="xp">✨ +${xpGain} XP</div>
        <div style="width:100%;max-width:20rem;margin-top:2rem;display:flex;flex-direction:column;gap:.6rem">
          <button class="btn" id="r-again">Play again</button>
          <button class="btn ghost" id="r-done">Back to quizzes</button>
        </div>
      </div>
    </div>`;
      fireConfetti((isSpeed ? Q.correct >= 8 : pct >= 70) ? 36 : 14);
      const type = Q.type;
      el('r-again').onclick = () => startQuiz(type);
      el('r-done').onclick = endQuizOverlay;
    }

    function fireConfetti(n) {
      const colors = ['#5A46E8', '#FF7A3C', '#1FA97A', '#F5B70A', '#E8578A'];
      const host = el('app') || document.body;
      const h = host.clientHeight || window.innerHeight, wgap = host.clientWidth || window.innerWidth;
      for (let i = 0; i < n; i++) {
        const c = document.createElement('div');
        c.className = 'confetti';
        c.style.background = colors[i % colors.length];
        c.style.left = Math.random() * wgap + 'px';
        c.style.top = '-12px';
        c.style.opacity = '1';
        host.appendChild(c);
        const dx = (Math.random() - .5) * 240, dur = 1600 + Math.random() * 1200, rot = Math.random() * 720;
        c.animate([
          { transform: 'translate(0,0) rotate(0)', opacity: 1 },
          { transform: `translate(${dx}px,${h + 40}px) rotate(${rot}deg)`, opacity: .9 }
        ], { duration: dur, easing: 'cubic-bezier(.2,.6,.4,1)' }).onfinish = () => c.remove();
      }
    }

    /* ============================================================
       CATEGORY MANAGEMENT + stacked overlays
       ============================================================ */
    let regDraft = null;

    /* A lightweight sheet that stacks ON TOP of an existing modal (own element) */
    function sheetOverlay(inner, z) {
      const wrap = document.createElement('div');
      wrap.className = 'modal-bg'; wrap.style.zIndex = z || 80;
      wrap.innerHTML = `<div class="modal"><div class="grab"></div>${inner}</div>`;
      (el('app') || document.body).appendChild(wrap);
      wrap.onclick = e => { if (e.target === wrap) wrap.remove(); };
      return wrap;
    }
    function openTextPrompt(title, placeholder, initial, onSave) {
      const wrap = sheetOverlay(`
    <h3>${esc(title)}</h3>
    <div class="field"><input class="input" id="tp-in" placeholder="${esc(placeholder || '')}" value="${esc(initial || '')}" autocomplete="off"></div>
    <div class="row2"><button class="btn ghost" id="tp-cancel">Cancel</button><button class="btn" id="tp-save">Save</button></div>`);
      const done = () => { const v = wrap.querySelector('#tp-in').value.trim(); wrap.remove(); onSave(v); };
      wrap.querySelector('#tp-cancel').onclick = () => wrap.remove();
      wrap.querySelector('#tp-save').onclick = done;
      const inp = wrap.querySelector('#tp-in');
      inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); done(); } };
      setTimeout(() => inp.focus(), 60);
    }
    function nestedConfirm(title, text, label, onYes, danger) {
      const wrap = sheetOverlay(`
    <h3>${esc(title)}</h3>
    <p style="color:var(--ink-soft);line-height:1.55;margin-bottom:1.3rem">${esc(text)}</p>
    <div class="row2"><button class="btn ghost" id="ncf-no">Cancel</button><button class="btn ${danger ? 'danger' : ''}" id="ncf-yes">${esc(label)}</button></div>`, 82);
      wrap.querySelector('#ncf-no').onclick = () => wrap.remove();
      wrap.querySelector('#ncf-yes').onclick = () => { wrap.remove(); onYes(); };
    }

    function openManageCat(name) {
      if (!S.cats.some(x => x.name === name)) return;
      function draw() {
        const cur = S.cats.find(x => x.name === name); if (!cur) { closeModal(); render(); return; }
        const subLbl = cur.subLabel || 'Source';
        const subs = cur.subs || [];
        const subList = subs.length ? subs.map((s, i) => `
      <div style="display:flex;align-items:center;justify-content:space-between;gap:.6rem;padding:.55rem .1rem;border-top:1px solid var(--line)">
        <div style="font-weight:600">${esc(s)}</div>
        <div style="display:flex;gap:.3rem">
          <button class="act" data-subedit="${i}" aria-label="Rename">${I.edit}</button>
          <button class="act" data-subdel="${i}" aria-label="Remove">${I.trash}</button>
        </div>
      </div>`).join('')
          : `<div class="d" style="padding:.5rem .1rem">No ${esc(subLbl.toLowerCase())}s yet. Add the ${esc(cur.name.toLowerCase())}s you're collecting words from.</div>`;
        modal(`
      <h3>Manage ${esc(cur.emoji)} ${esc(name)}</h3>
      <div class="field"><label>Category name</label><input class="input" id="mc-name" value="${esc(name)}" autocomplete="off"></div>
      <div class="row2" style="margin-top:0">
        <div class="field" style="flex:0 0 30%"><label>Emoji</label><input class="input" id="mc-emoji" value="${esc(cur.emoji)}" maxlength="2" style="text-align:center"></div>
        <div class="field" style="flex:1"><label>Item label</label><input class="input" id="mc-sublabel" value="${esc(subLbl)}" autocomplete="off"></div>
      </div>
      <button class="btn soft" id="mc-savemeta" style="margin-bottom:1.4rem">Save name &amp; emoji</button>

      <div class="field">
        <label>${esc(subLbl)}s <span class="opt">· e.g. book titles, movie names, news topics</span></label>
        <div style="margin-bottom:.3rem">${subList}</div>
        <button class="btn ghost" id="mc-addsub" style="margin-top:.7rem">${I.plus}Add ${esc(subLbl.toLowerCase())}</button>
      </div>

      <button class="btn danger" id="mc-delete" style="margin-top:.4rem">Delete category</button>
      <button class="btn ghost" id="mc-close" style="margin-top:.6rem">Done</button>
    `);

        el('mc-close').onclick = () => { closeModal(); render(); };

        el('mc-savemeta').onclick = () => {
          const newName = el('mc-name').value.trim();
          const emoji = el('mc-emoji').value.trim() || cur.emoji;
          const subLabel = el('mc-sublabel').value.trim() || 'Source';
          if (!newName) { toast('Name can\'t be empty'); return; }
          if (newName !== name && S.cats.some(x => x.name.toLowerCase() === newName.toLowerCase())) { toast('That name already exists'); return; }
          if (newName !== name) {
            // keep all word records: just relabel their category
            S.entries.forEach(e => { if (e.category === name) { e.category = newName; e.updatedAt = Date.now(); } });
            if (S.lastCat === name) S.lastCat = newName;
            if (S.lastSub[name] !== undefined) { S.lastSub[newName] = S.lastSub[name]; delete S.lastSub[name]; }
            S.entries.filter(e => e.category === newName).forEach(e => { fbWrite(e); sheetPush('update', e); });
          }
          cur.name = newName; cur.emoji = emoji; cur.subLabel = subLabel;
          name = newName;
          save(); toast('Category updated', '✏️'); draw();
        };

        el('mc-addsub').onclick = () => openTextPrompt('Add ' + subLbl, subLbl + ' name', '', (val) => {
          if (!val) return;
          if (!cur.subs) cur.subs = [];
          if (cur.subs.some(s => s.toLowerCase() === val.toLowerCase())) { toast('Already in the list'); return; }
          cur.subs.push(val); save(); draw();
        });

        document.querySelectorAll('[data-subedit]').forEach(b => b.onclick = () => {
          const i = +b.dataset.subedit, old = cur.subs[i];
          openTextPrompt('Rename ' + subLbl.toLowerCase(), subLbl + ' name', old, (val) => {
            if (!val || val === old) return;
            // keep records: relabel their sub
            S.entries.forEach(e => { if (e.category === name && e.sub === old) { e.sub = val; e.updatedAt = Date.now(); fbWrite(e); sheetPush('update', e); } });
            if (S.lastSub[name] === old) S.lastSub[name] = val;
            cur.subs[i] = val; save(); draw();
          });
        });

        document.querySelectorAll('[data-subdel]').forEach(b => b.onclick = () => {
          const i = +b.dataset.subdel, old = cur.subs[i];
          cur.subs.splice(i, 1);
          if (S.lastSub[name] === old) S.lastSub[name] = '';
          save(); toast('Removed from list. Words kept.', '🗑️'); draw();
        });

        el('mc-delete').onclick = () => {
          if (S.cats.length <= 1) { toast('Keep at least one category'); return; }
          nestedConfirm('Delete “' + name + '”?',
            'Your saved words under this category stay in Records — only the category button is removed.',
            'Delete category', () => {
              S.cats = S.cats.filter(x => x.name !== name);
              if (S.lastCat === name) S.lastCat = S.cats[0].name;
              delete S.lastSub[name];
              save(); closeModal(); render(); toast('Category deleted · words kept', '🗑️');
            }, true);
        };
      }
      draw();
    }

    /* ============================================================
       AUTH GATE (shown only when BAKED.ownerEmail is set)
       ============================================================ */
    function applyBaked() {
      if (typeof BAKED === 'undefined' || !BAKED) return;
      if (BAKED.firebase) {
        S.cfg.firebase = (typeof BAKED.firebase === 'string') ? BAKED.firebase : JSON.stringify(BAKED.firebase);
      }
      if (BAKED.sheetUrl) { S.cfg.sheet = BAKED.sheetUrl; }
    }
    let authMode = 'choice';   // 'choice' | 'in' | 'up'
    async function ensureAuthSdk() {
      const cfg = parseFirebaseConfig(S.cfg.firebase);
      if (!cfg || !cfg.databaseURL) return false;
      try {
        if (!window.firebase || !window.firebase.database) {
          await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js');
          await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js');
        }
        if (!window.firebase.auth) {
          await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js');
        }
        if (!window.firebase.apps.length) window.firebase.initializeApp(cfg);
        return !!window.firebase.auth;
      } catch (e) { console.warn('auth sdk load failed', e); return false; }
    }
    function showAuthGate(startMode) {
      authMode = startMode || 'choice';
      let wrap = el('auth-gate');
      if (!wrap) {
        wrap = document.createElement('div');
        wrap.id = 'auth-gate'; wrap.className = 'overlay authgate';
        (el('app') || document.body).appendChild(wrap);
      }
      drawAuthGate(wrap);
      // make sure the SDK is ready by the time they submit
      ensureAuthSdk().then(ok => {
        if (!ok && el('auth-gate')) {
          const err = el('auth-gate').querySelector('#au-err');
          if (err) err.textContent = 'Sync is unavailable here — open the app from a web address (http/https), not a local file.';
        }
      });
    }
    function hideAuthGate() { const g = el('auth-gate'); if (g) g.remove(); }
    function drawAuthGate(wrap) {
      if (authMode === 'choice') {
        wrap.innerHTML = `
      <div class="authbox">
        <div class="authlogo"><span class="brand-dot"></span> Wordbook</div>
        <p class="authsub">Sign in to sync your words across every device, or start locally and decide later.</p>
        <button class="btn" id="au-pick-login">Log in</button>
        <button class="btn ghost" id="au-pick-guest" style="margin-top:.65rem">Continue as Guest</button>
        <p class="authfoot">Guest mode keeps your words on this device only, until you sign in.</p>
      </div>`;
        wrap.querySelector('#au-pick-login').onclick = () => { authMode = 'in'; drawAuthGate(wrap); };
        wrap.querySelector('#au-pick-guest').onclick = () => {
          S.settings.guestMode = true; save();
          hideAuthGate();
          fbReady = false; fbStatus = 'Guest mode — not synced';
          render();
        };
        return;
      }
      const signup = authMode === 'up';
      wrap.innerHTML = `
    <div class="authbox">
      <button class="au-back" id="au-back">‹ Back</button>
      <div class="authlogo"><span class="brand-dot"></span> Wordbook</div>
      <p class="authsub">${signup ? 'Create your account once, then sign in on any device.' : 'Sign in to load and save your words across devices.'}</p>
      <input class="input" id="au-email" type="email" placeholder="Email" autocomplete="username" value="${esc(BAKED && BAKED.ownerEmail || '')}">
      <input class="input" id="au-pass" type="password" placeholder="Password" autocomplete="current-password" style="margin-top:.6rem">
      <div id="au-err" class="autherr"></div>
      <button class="btn" id="au-go" style="margin-top:1rem">${signup ? 'Create account' : 'Sign in'}</button>
      <button class="au-switch" id="au-switch">${signup ? 'Have an account? Sign in' : 'First time? Create your account'}</button>
    </div>`;
      wrap.querySelector('#au-back').onclick = () => { authMode = 'choice'; drawAuthGate(wrap); };
      wrap.querySelector('#au-switch').onclick = () => { authMode = signup ? 'in' : 'up'; drawAuthGate(wrap); };
      wrap.querySelector('#au-go').onclick = () => doAuth(wrap);
      const pass = wrap.querySelector('#au-pass');
      pass.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); doAuth(wrap); } };
      setTimeout(() => { const em = wrap.querySelector('#au-email'); if (!em) return; (em.value ? pass : em).focus(); }, 60);
    }
    async function doAuth(wrap) {
      const email = (wrap.querySelector('#au-email').value || '').trim();
      const pass = wrap.querySelector('#au-pass').value || '';
      const errEl = wrap.querySelector('#au-err');
      const btn = wrap.querySelector('#au-go');
      errEl.textContent = '';
      if (!email || !pass) { errEl.textContent = 'Enter your email and password.'; return; }
      btn.disabled = true; btn.textContent = '…';
      const ready = await ensureAuthSdk();
      if (!ready) {
        btn.disabled = false; btn.textContent = authMode === 'up' ? 'Create account' : 'Sign in';
        errEl.textContent = 'Sync is unavailable here — open the app from a web address (http/https), not a local file.';
        return;
      }
      const auth = window.firebase.auth();
      try { await auth.setPersistence(window.firebase.auth.Auth.Persistence.LOCAL); } catch (e) { }
      const p = authMode === 'up'
        ? auth.createUserWithEmailAndPassword(email, pass)
        : auth.signInWithEmailAndPassword(email, pass);
      p.then(() => {
        // if initFirebase never attached a listener (e.g. gate opened manually), sync now
        if (!fbReady) initFirebase();
      }).catch(err => {
        btn.disabled = false; btn.textContent = authMode === 'up' ? 'Create account' : 'Sign in';
        const c = (err && err.code) || '';
        errEl.textContent =
          c.includes('wrong-password') || c.includes('invalid-credential') ? 'Wrong email or password.' :
            c.includes('user-not-found') ? 'No account yet — tap “Create your account”.' :
              c.includes('email-already-in-use') ? 'That account exists — switch to Sign in.' :
                c.includes('weak-password') ? 'Password should be at least 6 characters.' :
                  c.includes('invalid-email') ? 'That email doesn\'t look right.' :
                    c.includes('operation-not-allowed') ? 'Enable Email/Password sign-in in the Firebase console.' :
                      c.includes('unauthorized-domain') ? 'Add this site to Firebase ▸ Authentication ▸ Authorized domains.' :
                        (err && err.message) || 'Could not sign in.';
      });
      // onAuthStateChanged handles success (hides the gate + starts sync)
    }

    /* ============================================================
       BOOT
       ============================================================ */
    function boot() {
      load();
      applyBaked();
      applyChrome();
      render();
      // Show the Log in / Guest choice right away when a sign-in lock is configured.
      // Doing it here (not inside initFirebase) means the screen appears even if
      // Firebase is slow or blocked — the buttons always work.
      if (requireAuth() && !S.settings.guestMode) showAuthGate('choice');
      if (S.cfg.firebase) initFirebase();
    }
    boot();
  </script>
</body>
